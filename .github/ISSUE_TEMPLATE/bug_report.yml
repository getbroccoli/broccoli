name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run Broccoli?
      options:
        - Docker Compose (self-hosted)
        - Minari Cloud (managed)
        - Local development
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v0.1.0 or a1b2c3d
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Remove personal data, secrets and employee records first.
      render: shell
