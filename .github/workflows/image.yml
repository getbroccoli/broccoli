name: Image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish image
    # Only branches of this repository can publish; forks get no packages token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-hosted, not the shared self-hosted runner: the registry token and the built
    # image stay on a machine no other job uses, and it is discarded afterwards.
    runs-on: ubuntu-24.04
    env:
      # A pull request builds its head commit, not GitHub's merge commit, so the tag names a real commit.
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - name: Log in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Emulates arm64, for main's images.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name == 'push'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Each commit gets its own tag, the short SHA that deployments pin. Main also moves `latest`, which
      # the installer runs, for amd64 and arm64; pull requests build amd64 only, to stay fast.
      - name: Build and push
        run: |
          image=ghcr.io/getbroccoli/broccoli
          options=(--platform linux/amd64 --tag "$image:${COMMIT::7}")
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            options=(--platform linux/amd64,linux/arm64 --tag "$image:${COMMIT::7}" --tag "$image:latest")
          fi
          docker buildx build --file packages/api/Dockerfile "${options[@]}" --push .
