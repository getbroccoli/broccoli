name: Image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  # A pull request builds its head commit, so the tag names a real commit.
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  IMAGE: ghcr.io/getbroccoli/broccoli

jobs:
  build:
    name: Build image (${{ matrix.arch }})
    # Only branches of this repository can publish; forks get no packages token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-hosted, not the shared self-hosted runner: the registry token and the built
    # image stay on a machine no other job uses, and it is discarded afterwards.
    strategy:
      matrix:
        arch: ${{ fromJSON(github.event_name == 'push' && '["amd64", "arm64"]' || '["amd64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - name: Log in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push
        run: |
          tag="${COMMIT::7}"
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            # Run-specific tags keep concurrent builds apart and survive partial reruns.
            tag="build-$GITHUB_RUN_ID-$ARCH"
          fi
          docker buildx build --file packages/api/Dockerfile --platform "linux/$ARCH" --tag "$IMAGE:$tag" --push .

  publish:
    name: Publish image
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Publish both architectures together under the commit tag and the installer's latest tag.
      - name: Publish multi-platform image
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${COMMIT::7}" --tag "$IMAGE:latest" \
            "$IMAGE:build-$GITHUB_RUN_ID-amd64" "$IMAGE:build-$GITHUB_RUN_ID-arm64"
