packages:
  - packages/*
# The development containers run Linux on the host's node_modules, so a macOS install also
# fetches the Linux builds of native packages.
supportedArchitectures:
  os: [current, linux]
  cpu: [current]
  libc: [current, glibc]
allowBuilds:
  "@apollo/protobufjs": false
  esbuild: false
  unrs-resolver: false
# pdf.js needs a canvas only to draw pages; the PDF reader never draws, so no native code loads.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"
