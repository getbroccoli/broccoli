"Someone who works for the company."
type Employee implements AnyRecord {
  id: ID!
  firstName: String!
  lastName: String!
  "Work email, lowercased; unique."
  email: String!
  jobTitle: String
  "First working day."
  startDate: Date
  "The id of the person's direct manager today; null without one."
  managerId: ID
  "The person's direct manager today; null without one."
  manager: Employee
  "Where the person works now; null without a location."
  location: Location
  "Path of the employee's avatar, such as `/api/employees/avatar/<id>`; null without one."
  avatarUrl: String
  createdAt: DateTime!
  "Changes to this employee, newest first."
  history("Page size, 1 to 10000." first: Int = 50, after: String): RecordChangeConnection!
  "What the signed-in user may do to this employee."
  access: RecordAccess!
  "The permission profiles of the user who signs in as this person, EMPLOYEE first; null when nobody does."
  permissionProfiles: [PermissionProfile!]
  "Whether this person can sign in, and their invite; null for callers who may not manage invites."
  signInStatus: SignInStatus
}

"Whether a person can sign in."
enum SignInState {
  "No open invite, and no account."
  NOT_INVITED
  "An invite is open, or has expired without being accepted."
  PENDING
  "The person accepted an invite and signs in."
  JOINED
}

type SignInStatus {
  state: SignInState!
  "The linked user is the workspace owner, or an unlinked, non-demo employee has the owner's email."
  isWorkspaceOwner: Boolean!
  "When the pending invite stops working; null without one."
  expiresAt: DateTime
  "Whether sending the pending invite's email failed."
  notSent: Boolean!
  "Whether the person's email already belongs to an account, so they cannot be invited."
  emailHasAccount: Boolean!
  "Whether an invite can be sent: not joined, not demo data, and no account has the person's email."
  canBeInvited: Boolean!
}

"How an invite reaches the person."
enum InviteDelivery {
  "Emailed with the instance's mail choice."
  SENT_BY_EMAIL
  "A link the admin copies and sends themselves."
  COPIED_BY_OWNER
}

# Adds how invites reach people to the setup state; the server merges the types.
type Setup {
  "How invites reach people now: SENT_BY_EMAIL while mail is chosen, else COPIED_BY_OWNER. Null for callers who may not manage invites; the setup holder sees it for setup's invites."
  inviteDelivery: InviteDelivery
}

# Adds the employee's causes to the shared list; the server merges them.
enum RecordChangeCauseKind {
  "The person's manager was removed, so they have none; the line's manager change names them. No ref."
  MANAGER_REMOVED
  "An admin invited the person to sign in, or made them a new link; the ref is the invite."
  INVITE_SENT
  "An admin cancelled the person's open invite; the ref is the invite."
  INVITE_CANCELLED
  "The person accepted their invite and signed in for the first time; the ref is the invite."
  INVITE_ACCEPTED
  "Turning time off on set up the terms, in setup or the demo. No ref."
  TIME_OFF_TURNED_ON
}

# Adds the employee to the shared list of record types that keep history; the server merges them.
enum RecordType {
  EMPLOYEE
  TERMS
}

type EmployeeEdge {
  cursor: String!
  node: Employee!
}

type EmployeeConnection {
  edges: [EmployeeEdge!]!
  pageInfo: PageInfo!
}

enum EmployeeOrderField {
  "First name, then last name, ignoring case."
  NAME
  EMAIL
  "Employees without a start date come last in both directions."
  START_DATE
}

input EmployeeOrder {
  field: EmployeeOrderField!
  direction: OrderDirection! = ASC
}

input EmployeeFilter {
  "Matches full name or email containing it, ignoring case; at most 100 characters."
  search: String
}

input EmployeeCreateInput {
  firstName: String!
  lastName: String!
  "Unique, compared without case."
  email: String!
  jobTitle: String
  startDate: Date
}

"The fields to change; a field left out stays as it is, and null clears a field that may be empty."
input EmployeeUpdateInput {
  id: ID!
  firstName: String
  lastName: String
  "Unique, compared without case."
  email: String
  jobTitle: String
  startDate: Date
  "The person's direct manager from today; null for none. Not the person themselves, nor someone who reports to them."
  managerId: ID
  "Where the person works; null for no location. Admins only."
  locationId: ID
  "Why the change is made, kept on the history line as its reason; at most 500 characters."
  changeReason: String
}

input EmployeeSetPermissionProfilesInput {
  id: ID!
  "The profiles the person has beside EMPLOYEE, which everyone has; the owner's never change."
  profiles: [PermissionProfile!]!
  "Why the change is made, kept on the history line as its reason; at most 500 characters."
  changeReason: String
}

input EmployeeDeleteInput {
  id: ID!
  "Why the employee is removed, kept on the history line as its reason; at most 500 characters."
  changeReason: String
}

type EmployeesMutations {
  "Adds an employee. Admins only."
  create(input: EmployeeCreateInput!): EmployeeCreatePayload!
  "Changes an employee's fields and records the change in their history. Refused, naming each field, for a field the caller may not change; see `access`."
  update(input: EmployeeUpdateInput!): EmployeeUpdatePayload!
  "Removes an employee and their avatar; their history stays. Admins only; never the owner."
  delete(input: EmployeeDeleteInput!): EmployeeDeletePayload!
  "Sets the permission profiles of the user who signs in as this person, and records the change in their history. Admins only."
  setPermissionProfiles(input: EmployeeSetPermissionProfilesInput!): EmployeeUpdatePayload!
  "Makes one employee the manager of these employees from today, or no one with a null managerId, with a history line each; skips the manager among them. Refused as a whole when it would make a loop, and for a person whose manager the caller may not change."
  setManagers(input: EmployeeSetManagersInput!): EmployeeSetManagersPayload!
  "Invites people to sign in: one new invite each, replacing any open one; skips people who joined, whose email has an account, or who are demo data. Admins only."
  invite(input: InviteSendInput!): InviteSendPayload!
  "Cancels a person's open invite; its link stops working. Admins only."
  cancelInvite(input: InviteCancelInput!): InviteCancelPayload!
  "Adds a location. Admins only."
  createLocation(input: LocationCreateInput!): LocationCreatePayload!
  "Renames a location. Admins only."
  updateLocation(input: LocationUpdateInput!): LocationUpdatePayload!
  "Deletes a location nobody is in; refused with a conflict while someone is. Admins only."
  deleteLocation(input: LocationDeleteInput!): LocationDeletePayload!
  "Adds terms on a Mon–Fri week, 7.5 hours a day, with these bank holidays and no time off offered. Admins only."
  createTerms(input: TermsCreateInput!): TermsCreatePayload!
  "Changes terms' fields and records the change in their history; renaming is always allowed. Admins only."
  updateTerms(input: TermsUpdateInput!): TermsUpdatePayload!
  "Deletes terms nobody was ever on and no location starts people on, never the default terms; refused with a conflict saying why otherwise. Admins only."
  deleteTerms(input: TermsDeleteInput!): TermsDeletePayload!
}

input InviteSendInput {
  "1 to 1,000 employees."
  employeeIds: [ID!]!
  "The profiles beside EMPLOYEE, which everyone has; never OWNER."
  profiles: [PermissionProfile!]
  "Goes into every emailed invite; plain text, up to 1,000 characters."
  note: String
  "COPIED_BY_OWNER for links even while mail is chosen; defaults to `Setup.inviteDelivery`."
  delivery: InviteDelivery
}

type SentInvite {
  employee: Employee!
  expiresAt: DateTime!
  delivery: InviteDelivery!
  "The link to copy and send; only for COPIED_BY_OWNER, and only in this answer."
  link: String
  "The line the invite added to the person's history."
  historyLine: RecordChange!
}

"The invites made, or why the call was refused."
type InviteSendPayload {
  invites: [SentInvite!]
  error: InviteSendError
}

union InviteSendError = InvalidInputError | NotFoundError | ConflictError

input InviteCancelInput {
  employeeId: ID!
}

"The person whose invite was cancelled, or why it was refused."
type InviteCancelPayload {
  employee: Employee
  "The line the cancellation added to the person's history."
  historyLine: RecordChange
  error: InviteCancelError
}

union InviteCancelError = NotFoundError

"The new employee, or why it was refused."
type EmployeeCreatePayload {
  employee: Employee
  error: EmployeeCreateError
}

union EmployeeCreateError = InvalidInputError

"The changed employee and the history line it added, or why the change was refused."
type EmployeeUpdatePayload {
  employee: Employee
  "The history line this update added; null when it changed nothing."
  historyLine: RecordChange
  error: EmployeeUpdateError
}

union EmployeeUpdateError = InvalidInputError | NotFoundError

input EmployeeSetManagersInput {
  "1 to 1,000 employees."
  employeeIds: [ID!]!
  "An employee; null for no manager."
  managerId: ID
}

"The employees after `setManagers`, those the caller may read, or why it was refused."
type EmployeeSetManagersPayload {
  employees: [Employee!]
  "The lines it added to their history."
  historyLines: [RecordChange!]
  error: EmployeeSetManagersError
}

union EmployeeSetManagersError = InvalidInputError | NotFoundError

"The removed employee's id, or why the removal was refused."
type EmployeeDeletePayload {
  deletedEmployeeId: ID
  "The lines the removal added to the history of the people they managed."
  reportHistoryLines: [RecordChange!]
  error: EmployeeDeleteError
}

union EmployeeDeleteError = InvalidInputError | NotFoundError

# Adds the signed-in user's employee to `me`; the server merges the types.
type User {
  "The signed-in user's own employee record; null for a user without one, such as the owner."
  employee: Employee
}

# Each module declares its own root fields; the server merges them into one type.
type Query {
  "Every location, by name ignoring case."
  locations: [Location!]!
  "One employee; null when there is none."
  employee(id: ID!): Employee
  "Employees, one page at a time."
  employees(
    "Page size, 1 to 10000."
    first: Int = 100
    after: String
    orderBy: EmployeeOrder = { field: NAME, direction: ASC }
    filter: EmployeeFilter
  ): EmployeeConnection!
  "Every set of terms, the default first, then by name. Admins only."
  allTerms: [Terms!]!
  "One set of terms; null when none has this id. Admins only."
  terms(id: ID!): Terms
}

"A named set of people who share a working week and time off rules; new people start on their location's terms."
type Terms implements AnyRecord {
  id: ID!
  name: String!
  "People without a location, or at a location without terms, start on the default terms."
  isDefault: Boolean!
  "People on these terms today."
  peopleCount: Int!
  "Locations whose new people start here, by name; the default terms also take locations without terms."
  locations: [Location!]!
  "The version covering today first, if any, then planned ones; past versions stay out."
  workingWeek: [WorkingWeekVersion!]!
  "Changes to these terms, newest first."
  history("Page size, 1 to 10000." first: Int = 50, after: String): RecordChangeConnection!
  "What the signed-in user may do to these terms."
  access: RecordAccess!
  "Why these terms cannot be deleted; null: they can."
  deleteBlocker: TermsDeleteBlocker
}

enum TermsDeleteBlocker {
  "People without a location start on the default terms."
  DEFAULT_TERMS
  "Someone was on these terms, even only in the past, so their history keeps them."
  TERMS_HAD_PEOPLE
  "A location starts its new people on these terms."
  LOCATION_STARTS_PEOPLE_ON_TERMS
}

input TermsCreateInput {
  "1 to 100 characters; unique, ignoring case and surrounding spaces."
  name: String!
  bankHolidayCalendar: BankHolidayCalendar!
}

"The fields to change; a field left out stays as it is, and null clears a field that may be empty."
input TermsUpdateInput {
  id: ID!
  "1 to 100 characters; unique, ignoring case and surrounding spaces. Never null: terms always have a name."
  name: String
}

input TermsDeleteInput {
  id: ID!
}

"The new terms, or why they were refused."
type TermsCreatePayload {
  terms: Terms
  error: TermsCreateError
}

union TermsCreateError = InvalidInputError

"The changed terms, or why the change was refused."
type TermsUpdatePayload {
  terms: Terms
  error: TermsUpdateError
}

union TermsUpdateError = InvalidInputError | NotFoundError

"The deleted terms' id, or why they were not deleted."
type TermsDeletePayload {
  deletedTermsId: ID
  error: TermsDeleteError
}

union TermsDeleteError = NotFoundError | ConflictError

"A working week from a date to a date: minutes worked each day, a full day of leave and whose bank holidays apply."
type WorkingWeekVersion {
  id: ID!
  "Null: from the beginning."
  startDate: Date
  "The last day; null: open-ended."
  endDate: Date
  mondayMinutes: Int!
  tuesdayMinutes: Int!
  wednesdayMinutes: Int!
  thursdayMinutes: Int!
  fridayMinutes: Int!
  saturdayMinutes: Int!
  sundayMinutes: Int!
  "The minutes one day of leave stands for."
  fullDayMinutes: Int!
  bankHolidayCalendar: BankHolidayCalendar!
}

type Mutation {
  employees: EmployeesMutations!
}

"A place where people work, such as an office or Remote; a person is in one at a time."
type Location {
  id: ID!
  "Unique, ignoring case and surrounding spaces."
  name: String!
  "How many people are in this location now."
  peopleCount: Int!
}

input LocationCreateInput {
  "1 to 100 characters; unique, ignoring case and surrounding spaces."
  name: String!
}

input LocationUpdateInput {
  id: ID!
  "1 to 100 characters; unique, ignoring case and surrounding spaces. People's history keeps the old name."
  name: String!
}

input LocationDeleteInput {
  id: ID!
}

"The new location, or why it was refused."
type LocationCreatePayload {
  location: Location
  error: LocationCreateError
}

union LocationCreateError = InvalidInputError

"The renamed location, or why it was refused."
type LocationUpdatePayload {
  location: Location
  error: LocationUpdateError
}

union LocationUpdateError = InvalidInputError | NotFoundError

"The deleted location's id, or why it was refused."
type LocationDeletePayload {
  deletedLocationId: ID
  error: LocationDeleteError
}

union LocationDeleteError = NotFoundError | ConflictError
