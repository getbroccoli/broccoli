"Whether this instance holds demo data, the sample company it starts with."
type DemoData {
  "Always `demoData`: one per instance."
  id: ID!
  isPresent: Boolean!
}

type Query {
  "Owner only."
  demo: DemoData!
}

type DemoMutations {
  "Deletes every demo record; records people added stay. Owner only."
  clear: DemoMutationPayload!
}

"Demo data after a mutation."
type DemoMutationPayload {
  demoData: DemoData
}

type Mutation {
  demo: DemoMutations!
}
