"Whether this instance holds demo data, the sample company it starts with."
type DemoData {
  "Always `demoData`: one per instance."
  id: ID!
  isPresent: Boolean!
}

type Query {
  "Owner only."
  demo: DemoData!
}

type DemoMutations {
  """
  Ends the demo: deletes every person, the demo people and anyone added, and takes setup back
  to the company step. Refused without demo data and during the self-hosted demo, whose owner
  exits through setup. Owner only.
  """
  exit: DemoExitPayload!
}

"Demo data after `exit`, or why it was refused."
type DemoExitPayload {
  demoData: DemoData
  error: DemoExitError
}

union DemoExitError = ConflictError

type Mutation {
  demo: DemoMutations!
}

# Adds this module's cause of record changes to the shared enum; the server merges them.
enum RecordChangeCauseKind {
  "Broccoli added the sample company's people when the demo started."
  ADDED_WITH_DEMO
}
