"Whether this instance holds demo data, the sample company it starts with."
type DemoData {
  "Always `demoData`: one per instance."
  id: ID!
  isPresent: Boolean!
}

type Query {
  "Owner only."
  demo: DemoData!
}

type Mutation {
  """
  Ends the demo: deletes every person, the demo people and anyone added, and takes setup back
  to the company step. Refused without demo data and during the self-hosted demo, whose owner
  exits through setup. Owner only.
  """
  exitDemo: DemoExitPayload!
}

"Demo data after `exitDemo`, or why it was refused."
type DemoExitPayload {
  demoData: DemoData
  error: DemoExitError
}

union DemoExitError = ConflictError
