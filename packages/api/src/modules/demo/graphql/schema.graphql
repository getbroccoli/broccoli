"Whether this instance holds demo data, the sample company it starts with."
type DemoData {
  "Always `demoData`: one per instance."
  id: ID!
  isPresent: Boolean!
}

type Query {
  "Owner only."
  demoData: DemoData!
}

type DemoDataMutations {
  "Deletes every demo record; records people added stay. Owner only."
  clear: DemoData!
}

type Mutation {
  demoData: DemoDataMutations!
}
