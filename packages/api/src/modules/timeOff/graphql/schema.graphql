}

input LocationTermsInput {
  locationName: String!
  bankHolidayCalendar: BankHolidayCalendar!
}

type Mutation {
  timeOff: TimeOffMutations!
}

type TimeOffMutations {
  "Adds a company time off type. No terms offer it until they are given rules for it. Admins only."
  createType(input: TimeOffTypeCreateInput!): TimeOffTypeCreatePayload!
  "Changes a type's name, icon, colour, privacy and default rules, the same in every set of terms; terms already offering it keep their rules. Admins only."
  changeType(input: TimeOffTypeChangeInput!): TimeOffTypeChangePayload!
  "Deletes a type with its rules on every terms; refused while any time off of it is on record, whatever its status. Starting over brings a deleted standard type back. Admins only."
  deleteType(input: TimeOffTypeDeleteInput!): TimeOffTypeDeletePayload!
  "Saves the terms' unpublished rules for a type: created from the rules they have today, or the type's default rules for an offer, or saved again. Nobody's rules change until the terms are published. Admins only."
  saveTimeOffPolicy(input: TimeOffPolicySaveInput!): TimeOffPolicySavePayload!
  "Deletes unpublished rules. Admins only."
  discardTimeOffPolicy(input: TimeOffPolicyDiscardInput!): TimeOffPolicyDiscardPayload!
  "Saves the terms' unpublished draft for a type as a stop of their rules for it today, replacing a rules draft; Publish ends those rules from its date. Refused when the terms have no rules for the type today (`timeOffTypeId` / `not_offered`). Nobody's rules change until the terms are published. Admins only."
  saveTimeOffStop(input: TimeOffStopSaveInput!): TimeOffPolicySavePayload!
  "Removes a rules change that has not started; the rules before it run on, and a planned offer leaves the type not offered. Refused with a ConflictError once it has started. Admins only."
  cancelPolicyChange(input: TimeOffPolicyCancelChangeInput!): TimeOffPolicyCancelChangePayload!
  "Books approved time off for a person's working days from start to end; refused with an InvalidInputError whose field `dates` carries a TimeOffBookingRefusalReason in lower case. Booking over the balance is allowed. Admins only, for now."
  bookTimeOff(input: TimeOffBookInput!): TimeOffBookPayload!
  "Cancels a whole booking, giving its days back. Admins only, for now."
  cancelTimeOff(input: TimeOffCancelInput!): TimeOffCancelPayload!
  "Cancels a planned stop: the rules it ends, the type's last on their owner and ending on or after today, run on open-ended. Refused with a ConflictError when they are no planned stop. Admins only."
  cancelPolicyStop(input: TimeOffPolicyCancelStopInput!): TimeOffPolicyCancelStopPayload!
  "Publishes the terms' unpublished working week and rules and gives them, from a date no earlier than the start of the current leave year, to the owners asked: these terms and others using what they replace. How a type counts changes only from the start of a leave year (`rules.balance` / `not_leave_year_start`). A stop ends the owners' rules for its type the day before the date instead (`startDate` / `not_offered` when an owner has none then). Refused with a ConflictError when they were saved again since `versions` was read, or when a stop would leave booked time off without rules. Admins only."
  publishTerms(input: TermsPublishInput!): TermsPublishPayload!
  "Gives a person their own rules for a type from a date no earlier than this leave year's start or their start, over their terms', until their next own rules change if one is planned; changes them when they have their own then. How the type counts changes only from the start of a leave year (`rules.balance` / `not_leave_year_start`). Admins only."
  setOwnRules(input: TimeOffOwnRulesSetInput!): TimeOffOwnRulesPayload!
  "Puts a person back on their terms' rules for a type from a date: their own rules covering it end the day before, later ones go. The type is not offered to them where their terms don't offer it; refused with a ConflictError while that would leave their booked time off of the type without rules. Admins only."
  useTermsRules(input: TimeOffTermsRulesUseInput!): TimeOffOwnRulesPayload!
  "Removes a change to a person's own rules for a type that has not started: new own rules, a change to them, or a return to their terms. Refused with a ConflictError once it has started, or while cancelling it would leave their booked time off of the type without rules. Admins only."
  cancelOwnRulesChange(input: TimeOffOwnRulesCancelChangeInput!): TimeOffOwnRulesPayload!
}

