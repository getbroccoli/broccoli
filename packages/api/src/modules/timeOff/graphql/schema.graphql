extend type Employee {
  "One per time off type with a policy for this person, in the leave year containing today (or their start, when later), Annual leave first; empty when there is none, such as while time off is off; null for callers who may not read this person's time off."
  timeOffTypes: [EmployeeTimeOffType!]
}

"A time off type a person has in their current leave year, with its figures in days."
type EmployeeTimeOffType {
  timeOffType: TimeOffType!
  balance: TimeOffBalanceKind!
  "The first day of the leave year, or of the calendar year for NO_BALANCE."
  periodStart: Date!
  "The last day of the leave year, or of the calendar year for NO_BALANCE."
  periodEnd: Date!
  "Everything granted for the leave year, bank holidays on top and adjustments included; BALANCE_FROM_ALLOWANCE only."
  entitlement: Float
  "Bank holidays the leave year takes from the allowance; BALANCE_FROM_ALLOWANCE only."
  bankHolidays: Float
  "Entitlement less bank holidays and days used; BALANCE_FROM_ALLOWANCE only."
  remaining: Float
  "Days used from the allowance, or recorded for NO_BALANCE, in the period."
  used: Float!
}

"Time off as Settings shows it."
type TimeOffSettings {
  "Every time off type: Annual leave, Sickness, Family leave and Other first, then the company's own by name."
  timeOffTypes: [TimeOffTypeSummary!]!
  "People with an allowance whose leave year has not ended."
  peopleWithTimeOff: Int!
}

"A time off type as Settings lists it."
type TimeOffTypeSummary {
  timeOffType: TimeOffType!
  "The balance kind most of its policies have, the oldest policy's on a tie, so one policy may differ; null when it has none."
  balance: TimeOffBalanceKind
  "Days everyone took this calendar year, approved or pending; a half day counts 0.5."
  daysTakenThisYear: Float!
}

"A kind of time off, such as Annual leave or Sickness."
type TimeOffType {
  id: ID!
  name: String!
  "Its own icon, or SUN when it has none."
  icon: TimeOffTypeIcon!
  "Its own colour, or YELLOW when it has none."
  colour: TimeOffTypeColour!
  "Which seeded type this is; null on the company's own types."
  typeKey: TimeOffTypeKey
  "Colleagues see that the person is off, not why. Always true for Sickness."
  private: Boolean!
  "The rules offering the type on terms starts from; terms already offering it keep their own."
  defaultRules: TimeOffRules!
}

"How a type counts, as an admin sets it in Settings."
type TimeOffRules {
  balance: TimeOffBalanceKind!
  "Days a year for a 5-day week; BALANCE_FROM_ALLOWANCE only."
  entitlementDays: Float
  "BALANCE_FROM_ALLOWANCE only."
  bankHolidays: TimeOffBankHolidays
}

"The four time off types every workspace starts with."
enum TimeOffTypeKey {
  ANNUAL_LEAVE
  SICKNESS
  FAMILY_LEAVE
  OTHER
}

extend type Terms {
  "Every time off type in list order, with these terms' rules for it from today on; only that type when `timeOffTypeId` is given."
  timeOff(timeOffTypeId: ID): [TimeOffWithPolicies!]!
  "Whether the terms have a working week or time off rules saved and not published yet."
  hasUnpublishedChanges: Boolean!
  "What publishing the terms from `from` would do: their unpublished working week and rules, and everyone it reaches. Admins only."
  publishSuggestions(from: Date!): PublishSuggestions!
}

"A time off type with a set of terms' rules for it."
type TimeOffWithPolicies {
  timeOffType: TimeOffType!
  "Rules from the start of the current leave year on, oldest first: earlier ones, today's, then planned ones; none from today: not offered on these terms."
  versions: [TimeOffPolicyVersion!]!
  "The rules saved and not published yet; null: none."
  unpublished: UnpublishedTimeOffRules
  "The earliest date a change may apply from: the start of the current leave year."
  earliestChange: Date!
}

"Time off rules saved on terms and not published yet."
type UnpublishedTimeOffRules {
  id: ID!
  "Goes up by one each time they are saved; publishing names the revision it saw."
  revision: Int!
  balance: TimeOffBalanceKind!
  "Null unless the balance is BALANCE_FROM_ALLOWANCE."
  bankHolidays: TimeOffBankHolidays
  "When each leave year starts; null for NO_BALANCE."
  leaveYearStart: LeaveYearStart
  "The yearly allowance; null without one."
  yearlyEntitlement: YearlyEntitlement
}

"What publishing a set of terms from a date would do."
type PublishSuggestions {
  "The terms' unpublished working week and rules, as publishing names them."
  versions: [UnpublishedVersion!]!
  "These terms first, then every other set of terms or person using what a version replaces on that date."
  owners: [PublishOwner!]!
}

"An unpublished working week, or a type's unpublished rules."
type UnpublishedVersion {
  id: ID!
  revision: Int!
  "Null: the working week."
  timeOffTypeId: ID
}

"Terms or a person publishing can reach, with what they would get."
type PublishOwner {
  "Set for terms; null for a person."
  termsId: ID
  "Set for a person; null for terms."
  employeeId: ID
  "The terms' name, or the person's first and last name."
  name: String!
  "The unpublished versions they would get."
  versionIds: [ID!]!
  "The people it would reach, on some day from the date on, by name."
  reached: [Employee!]!
}

"How a type counts, as one version sets it."
input TimeOffRulesInput {
  balance: TimeOffBalanceKind!
  "0 to 366 days a year for a 5-day week, in half days; required when the balance is BALANCE_FROM_ALLOWANCE."
  entitlementDays: Float
  "Required when the balance is BALANCE_FROM_ALLOWANCE."
  bankHolidays: TimeOffBankHolidays
}

"A set of terms' unpublished rules for a type."
input TimeOffPolicySaveInput {
  termsId: ID!
  timeOffTypeId: ID!
  rules: TimeOffRulesInput!
}

input TimeOffPolicyDiscardInput {
  "The unpublished rules' id."
  versionId: ID!
}

"A set of terms stopping a type from a date."
input TimeOffPolicyStopInput {
  termsId: ID!
  timeOffTypeId: ID!
  "The first day the type is not offered; no earlier than the start of the current leave year."
  stopDate: Date!
}

input TimeOffPolicyCancelChangeInput {
  "The planned rules' id, as `TimeOffWithPolicies.versions` gives it."
  assignmentId: ID!
}

"What publishing a set of terms takes: the unpublished versions it read, the date, and who gets them."
input TermsPublishInput {
  termsId: ID!
  "Every unpublished version of the terms, as `publishSuggestions` gave them."
  versions: [TermsPublishVersionInput!]!
  startDate: Date!
  "Suggested owners to give the versions to; none publishes without giving them to anyone."
  owners: [AssignmentOwnerInput!]!
}

input TermsPublishVersionInput {
  id: ID!
  revision: Int!
}

"Exactly one of a set of terms or a person."
input AssignmentOwnerInput {
  termsId: ID
  employeeId: ID
}

"The saved unpublished rules, or why they were refused."
type TimeOffPolicySavePayload {
  rules: UnpublishedTimeOffRules
  error: TimeOffPolicySaveError
}

union TimeOffPolicySaveError = InvalidInputError

"The discarded rules' id, or why it was refused."
type TimeOffPolicyDiscardPayload {
  discardedVersionId: ID
  error: TimeOffPolicyDiscardError
}

union TimeOffPolicyDiscardError = NotFoundError

"The id of the rules that now end the day before the stop, or why it was refused."
type TimeOffPolicyStopPayload {
  stoppedAssignmentId: ID
  error: TimeOffPolicyStopError
}

union TimeOffPolicyStopError = InvalidInputError | ConflictError

input TimeOffPolicyCancelStopInput {
  "The id of the rules a planned stop ends, as `TimeOffWithPolicies.versions` gives it."
  assignmentId: ID!
}

"The id of the rules that run on open-ended, or why it was refused."
type TimeOffPolicyCancelStopPayload {
  reopenedAssignmentId: ID
  error: TimeOffPolicyCancelStopError
}

union TimeOffPolicyCancelStopError = NotFoundError | ConflictError

"The cancelled change's id, or why it was refused."
type TimeOffPolicyCancelChangePayload {
  cancelledAssignmentId: ID
  error: TimeOffPolicyCancelChangeError
}

"The terms as publishing left them, or why it was refused."
type TermsPublishPayload {
  terms: Terms
  error: TermsPublishError
}

union TermsPublishError = InvalidInputError | ConflictError

union TimeOffPolicyCancelChangeError = NotFoundError | ConflictError

"A time off type's rules from a date to a date."
type TimeOffPolicyVersion {
  "On terms, the id a planned change is cancelled by."
  id: ID!
  startDate: Date!
  "The last day; null: open-ended."
  endDate: Date
  balance: TimeOffBalanceKind!
  "Null unless the balance is BALANCE_FROM_ALLOWANCE."
  bankHolidays: TimeOffBankHolidays
  "When each leave year starts; null for NO_BALANCE."
  leaveYearStart: LeaveYearStart
  "The yearly allowance; null without one."
  yearlyEntitlement: YearlyEntitlement
}

"Whether bank holidays come on top of an allowance or out of it."
enum TimeOffBankHolidays {
  BANK_HOLIDAYS_ON_TOP_OF_ALLOWANCE
  BANK_HOLIDAYS_INCLUDED_IN_ALLOWANCE
}

"When a leave year starts."
type LeaveYearStart {
  kind: LeaveYearStartKind!
  "1 to 12; LEAVE_YEAR_FROM_FIXED_DATE only."
  month: Int
  "1 to 31; LEAVE_YEAR_FROM_FIXED_DATE only."
  day: Int
}

enum LeaveYearStartKind {
  "Every leave year starts on the same day of the year."
  LEAVE_YEAR_FROM_FIXED_DATE
  "Each person's leave year starts on the anniversary of their start date."
  LEAVE_YEAR_FROM_EMPLOYEE_START_DATE
}

"Days granted each year."
type YearlyEntitlement {
  "Days a year for a working week of daysPerWeek days."
  days: Float!
  daysPerWeek: Int!
}

"The icon a time off type shows."
enum TimeOffTypeIcon {
  SUN
  UMBRELLA
  AIRPLANE
  MOUNTAINS
  TREE
  LEAF
  BICYCLE
  CAR
  COFFEE
  MOON
  THERMOMETER
  FIRST_AID
  HEARTBEAT
  HEART
  HAND_HEART
  FLOWER
  BABY
  BACKPACK
  HOUSE_LINE
  USERS_THREE
  GRADUATION_CAP
  BOOK_OPEN
  BRIEFCASE
  TRUCK
  SCALES
  WALLET
  LIFEBUOY
  CONFETTI
  STAR
  SPARKLE
}

"The colour a time off type's icon sits on."
enum TimeOffTypeColour {
  GREEN
  CORAL
  YELLOW
  LIME
  TEAL
  BLUE
  INDIGO
  PURPLE
  PINK
  RED
}

"How a time off type's days are counted."
enum TimeOffBalanceKind {
  "A yearly allowance that days are taken from."
  BALANCE_FROM_ALLOWANCE
  "No limit; days used are counted per leave year."
  UNLIMITED_BALANCE
  "No allowance; days are only recorded."
  NO_BALANCE
}

"Whose bank holidays apply: one nation's, as GOV.UK publishes them."
enum BankHolidayCalendar {
  ENGLAND_AND_WALES
  SCOTLAND
  NORTHERN_IRELAND
}

"A UK working week an owner picks for terms when turning time off on."
enum StandardWorkingWeek {
  "Monday to Friday, 7.5 hours a day: the week a fresh workspace starts with."
  MONDAY_TO_FRIDAY_7_5_HOURS
  MONDAY_TO_FRIDAY_8_HOURS
  MONDAY_TO_FRIDAY_7_HOURS
  "Monday to Thursday, 8 hours a day: a four-day week."
  MONDAY_TO_THURSDAY_8_HOURS
}

"What Company defaults offers."
type TimeOffSetup {
  "The standard Annual leave policies, most common first."
  annualLeavePolicies: [AnnualLeavePolicy!]!
  bankHolidayCalendars: [BankHolidayCalendarYear!]!
}

"A standard Annual leave policy, which turning time off on copies into terms."
type AnnualLeavePolicy {
  key: StandardLeavePolicyKey!
  name: String!
  "The yearly allowance for a Monday-to-Friday week."
  daysForFiveDayWeek: Float!
  "True when bank holidays come on top of those days, false when they are taken from them."
  bankHolidaysOnTop: Boolean!
}

"A standard Annual leave policy Broccoli ships."
enum StandardLeavePolicyKey {
  "20 days plus bank holidays for a five-day week."
  UK_20_DAYS_PLUS_BANK_HOLIDAYS
  "25 days plus bank holidays for a five-day week."
  UK_25_DAYS_PLUS_BANK_HOLIDAYS
  "The UK statutory minimum: 28 days for a five-day week, at most 28, bank holidays included."
  UK_STATUTORY_MINIMUM
}

"How many bank holidays a nation has this year."
type BankHolidayCalendarYear {
  calendar: BankHolidayCalendar!
  countThisYear: Int!
}

"Whose bank holidays Broccoli's AI thinks apply at a location; unsure ones are England and Wales."
type LocationCalendarSuggestion {
  locationName: String!
  bankHolidayCalendar: BankHolidayCalendar!
  unsure: Boolean!
}

type Query {
  "Time off as Settings shows it; admins only."
  timeOffSettings: TimeOffSettings!
  "Admins, and the browser holding setup."
  timeOffSetup: TimeOffSetup!
  """
  Whose bank holidays apply at each location, in the order given; only the names reach the AI.
  Without an answer a location is England and Wales, unsure. Admins, and the browser holding setup.
  """
  locationCalendarSuggestions(locationNames: [String!]!): [LocationCalendarSuggestion!]!
}

"How time off is turned on."
input TurnOnTimeOffInput {
  "One per nation's terms; the default nation's is required."
  terms: [TermsSetupInput!]!
  "Which nation's terms each location's people get; any other location's get the default nation's."
  locationTerms: [LocationTermsInput!]!
  "The nation of the default terms, which people without a location start on; England and Wales when left out."
  defaultBankHolidayCalendar: BankHolidayCalendar
}

"One nation's terms: its working week and Annual leave policy."
input TermsSetupInput {
  bankHolidayCalendar: BankHolidayCalendar!
  workingWeek: StandardWorkingWeek!
  annualLeavePolicyKey: StandardLeavePolicyKey!
}

input LocationTermsInput {
  locationName: String!
  bankHolidayCalendar: BankHolidayCalendar!
}

type Mutation {
  timeOff: TimeOffMutations!
}

type TimeOffMutations {
  "Adds a company time off type. No terms offer it until they are given rules for it. Admins only."
  createType(input: TimeOffTypeCreateInput!): TimeOffTypeCreatePayload!
  "Changes a type's name, icon, colour, privacy and default rules, the same in every set of terms; terms already offering it keep their rules. Admins only."
  changeType(input: TimeOffTypeChangeInput!): TimeOffTypeChangePayload!
  "Deletes a type with its rules on every terms; refused while any time off of it is on record, whatever its status. Starting over brings a deleted standard type back. Admins only."
  deleteType(input: TimeOffTypeDeleteInput!): TimeOffTypeDeletePayload!
  "Saves the terms' unpublished rules for a type: created from the rules they have today, or the type's default rules for an offer, or saved again. Nobody's rules change until the terms are published. Admins only."
  saveTimeOffPolicy(input: TimeOffPolicySaveInput!): TimeOffPolicySavePayload!
  "Deletes unpublished rules. Admins only."
  discardTimeOffPolicy(input: TimeOffPolicyDiscardInput!): TimeOffPolicyDiscardPayload!
  "Stops offering the type on the terms from a date no earlier than the start of the current leave year: their rules end the day before, and later ones go. Refused with a ConflictError while someone's booked time off of the type from that date would be left without rules. Admins only."
  stopPolicy(input: TimeOffPolicyStopInput!): TimeOffPolicyStopPayload!
  "Removes a rules change that has not started; the rules before it run on, and a planned offer leaves the type not offered. Refused with a ConflictError once it has started. Admins only."
  cancelPolicyChange(input: TimeOffPolicyCancelChangeInput!): TimeOffPolicyCancelChangePayload!
  "Cancels a planned stop: the rules it ends, the type's last on their owner and ending on or after today, run on open-ended. Refused with a ConflictError when they are no planned stop. Admins only."
  cancelPolicyStop(input: TimeOffPolicyCancelStopInput!): TimeOffPolicyCancelStopPayload!
  "Publishes the terms' unpublished working week and rules and gives them, from a date no earlier than the start of the current leave year, to the owners asked: these terms and others using what they replace. How a type counts changes only from the start of a leave year (`rules.balance` / `not_leave_year_start`). Refused with a ConflictError when they were saved again since `versions` was read. Admins only."
  publishTerms(input: TermsPublishInput!): TermsPublishPayload!
}

input TimeOffTypeCreateInput {
  "1 to 60 characters; unique, ignoring case and surrounding spaces."
  name: String!
  icon: TimeOffTypeIcon!
  colour: TimeOffTypeColour!
  "Colleagues see that the person is off, not why."
  private: Boolean!
  "The rules offering the type on terms starts from."
  defaultRules: TimeOffRulesInput!
}

"Every field is sent; the panel always has them all."
input TimeOffTypeChangeInput {
  timeOffTypeId: ID!
  "1 to 60 characters; unique, ignoring case and surrounding spaces."
  name: String!
  icon: TimeOffTypeIcon!
  colour: TimeOffTypeColour!
  "Must stay true for Sickness."
  private: Boolean!
  "The rules offering the type on terms starts from; terms already offering it keep their rules."
  defaultRules: TimeOffRulesInput!
}

"The new time off type, or why it was refused."
type TimeOffTypeCreatePayload {
  timeOffType: TimeOffType
  error: TimeOffTypeCreateError
}

union TimeOffTypeCreateError = InvalidInputError

"The changed time off type, or why it was refused."
type TimeOffTypeChangePayload {
  timeOffType: TimeOffType
  error: TimeOffTypeChangeError
}

union TimeOffTypeChangeError = InvalidInputError | NotFoundError

input TimeOffTypeDeleteInput {
  timeOffTypeId: ID!
}

"The deleted time off type's id, or why it was refused."
type TimeOffTypeDeletePayload {
  deletedTimeOffTypeId: ID
  error: TimeOffTypeDeleteError
}

union TimeOffTypeDeleteError = NotFoundError | ConflictError

extend type EmployeeEmploymentTerms {
  "Every company time off type in list order, with the person's rules for it from today on; null for callers who may not read the person's time off."
  timeOff: [PersonTimeOff!]
}

"A company time off type with a person's rules for it from today on."
type PersonTimeOff {
  timeOffType: TimeOffType!
  "Today's rules first, if any, then each later change; empty: not offered to the person."
  versions: [PersonTimeOffRules!]!
}

"Time off rules as they apply to one person from a date until the next change."
type PersonTimeOffRules {
  source: RuleSource!
  startDate: Date!
  "The last day; null: open-ended."
  endDate: Date
  rules: TimeOffPolicyVersion!
}
