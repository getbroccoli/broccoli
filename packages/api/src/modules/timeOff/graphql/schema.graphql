type Query {
  "Time off as Settings shows it; admins only."
  timeOffSettings: TimeOffSettings!
  "Admins, and the browser holding setup."
  timeOffSetup: TimeOffSetup!
  """
  Whose bank holidays apply at each location, in the order given; only the names reach the AI.
  Without an answer a location is England and Wales, unsure. Admins, and the browser holding setup.
  """
  locationCalendarSuggestions(locationNames: [String!]!): [LocationCalendarSuggestion!]!
  "What booking or asking for it would cost and do, without writing anything; for whoever may create the person's time off."
  timeOffBookingPreview(input: TimeOffBookInput!): TimeOffBookingPreview!
}

"One person's dates and time off over a range."
type EmployeeWhosOut {
  "Every date of the range, oldest first."
  days: [WhosOutDay!]!
  "Approved time off with a day in the range, and requested time off for who may read this person's time off, oldest first."
  timeOff: [TimeOff!]!
}

type WhosOutDay {
  date: Date!
  kind: WhosOutDayKind!
  "Set on BANK_HOLIDAY."
  bankHolidayName: String
}

enum WhosOutDayKind {
  WORKING_DAY
  "The person's working week has no minutes on that weekday."
  NOT_A_WORKING_DAY
  "A bank holiday on one of the person's working days."
  BANK_HOLIDAY
  NOT_EMPLOYED
}

"A person's time off, booked straight away or requested and decided by an approver: its days that cost something when it was saved."
type TimeOff implements AnyRecord {
  id: ID!
  "Changes to this time off, newest first; empty for who may not read this person's time off."
  history("Page size, 1 to 10000." first: Int = 50, after: String): RecordChangeConnection!
  "What the signed-in user's permissions allow: canDelete is the delete grant alone, so read canCancel for the button; nobody edits it."
  access: RecordAccess!
  "Whether the signed-in user may cancel this time off now, among time off they may read: the person withdraws their own waiting request at any time, and cancels approved time off they asked for or booked only before its first day; admins cancel anyone's waiting request, or approved time off in a leave year that is still open."
  canCancel: Boolean!
  "Who cancelled it and when; null unless someone cancelled it (an approval that ended without a decision is no cancellation), and for callers who may not read this person's time off."
  cancellation: TimeOffCancellation
  "Null unless the caller may read this person's time off."
  status: TimeOffStatus
  "Set once a request is decided; null for bookings, waiting requests, requests that ended without a decision, and callers who may not read this person's time off."
  decision: TimeOffDecision
  "Null for a private type, such as Sickness, when the caller may not read this person's time off."
  timeOffType: TimeOffType
  startDate: Date!
  endDate: Date!
  days: [TimeOffDay!]!
  "Days booked, a half day 0.5; null unless the caller may read this person's time off."
  cost: Float
  "Null unless the caller may read this person's time off."
  note: String
  "When it was booked or requested; null unless the caller may read this person's time off."
  bookedAt: DateTime
}

"Where time off stands."
enum TimeOffStatus {
  "Asked for and waiting for approval; its days are held."
  REQUESTED
  APPROVED
  REJECTED
  CANCELLED
}

"Who cancelled time off, and when."
type TimeOffCancellation {
  "Null when no employee cancelled it, such as an owner without one, or once that person is deleted."
  cancelledBy: Employee
  cancelledAt: DateTime!
}

"Who decided a request, when, and their comment."
type TimeOffDecision {
  "Null once that person is deleted."
  decidedBy: Employee
  decidedAt: DateTime!
  comment: String
}

type TimeOffDay {
