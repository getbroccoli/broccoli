type Query {
  "Answers `pong`; checks that the GraphQL API is reachable."
  ping: String! @public
  "Where the instance is in its first-run flow; readable without signing in, so the web app can route."
  setup: Setup! @public
  "The signed-in user; null without a session. Readable without signing in, so the web app can route."
  me: User @public
}

"The signed-in user."
type User {
  id: ID!
  "Login email, lowercased."
  email: String!
  "True for the instance owner, who may do everything until permission scopes exist."
  isOwner: Boolean!
}

"Where a new instance is in its first-run flow."
enum SetupStep {
  "No owner yet: a self-hosted instance asks for the owner account."
  OWNER
  "The owner exists and has not named the company yet."
  COMPANY
  "The company is named; the owner brings in their people."
  IMPORT
  "Setup is finished."
  DONE
}

"How people sign in to this instance."
enum SignIn {
  "Email and password; the first visitor creates the owner."
  PASSWORD
  "Through the Broccoli accounts service, with Google or email."
  MANAGED
}

type Setup {
  "Always `instance`: one instance, so the client caches one object."
  id: ID!
  step: SetupStep!
  signIn: SignIn!
}
