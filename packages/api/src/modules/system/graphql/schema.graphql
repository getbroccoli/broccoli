type Query {
  "Answers `pong`; checks that the GraphQL API is reachable."
  ping: String! @public
  "Where the instance is in its first-run flow; readable without signing in, so the web app can route."
  setup: Setup! @public
  "The signed-in user; null without a session. Readable without signing in, so the web app can route."
  me: User @public
}

"The signed-in user."
type User {
  id: ID!
  "Login email, lowercased."
  email: String!
  "True for the instance owner, who may do everything until permission scopes exist."
  isOwner: Boolean!
}

"Where a new instance is in its first-run flow: company, import, then owner on self-hosted instances or ready on managed ones."
enum SetupStep {
  "The company has no name yet."
  COMPANY
  "The company is named; the people are brought in."
  IMPORT
  "Self-hosted only: the people are in; the owner account is created last."
  OWNER
  "Managed only: the people are in; the owner sees what setup added before using Broccoli."
  READY
  "Setup is finished."
  DONE
}

"Which browser holds self-hosted setup before the owner exists."
enum SetupHolder {
  "This browser holds setup."
  YOU
  "Another browser holds setup, or held it until its session expired."
  ANOTHER_DEVICE
  "Nobody: setup is free to start, or the owner exists."
  NOBODY
}

"How this instance is run, which decides how people sign in and the order of setup."
enum Mode {
  "Run by its owner: email and password, and the browser holding setup creates the owner at its last step."
  SELF_HOSTED
  "Run by Broccoli: people sign in through the Broccoli accounts service, with Google or email."
  MANAGED
}

enum OwnerSignInMethod {
  "Continue with Google."
  SIGN_IN_WITH_GOOGLE
  "A sign-in link sent by email."
  SIGN_IN_WITH_EMAIL
}

type Setup {
  "Always `instance`: one instance, so the client caches one object."
  id: ID!
  step: SetupStep!
  mode: Mode!
  holder: SetupHolder!
  "When the demo's provisional owner loses access unless they create their account; null for anyone else and once the account exists."
  demoExpiresAt: DateTime
  "How the managed owner signs in, so the sign-in page offers only that; null on self-hosted instances and until the owner's first sign-in names it."
  ownerSignInMethod: OwnerSignInMethod
  "How files are read with AI. Owner or setup holder only, though the rest of `Setup` is public; null when managed, which keeps its own key."
  ai: Ai
}

"How a self-hosted instance reads files with AI."
type Ai {
  "Always `ai`: one per instance."
  id: ID!
  "The source files are read with now: the owner's choice, else OpenRouter when a key exists, else Broccoli AI."
  source: AiSource!
  "Where the OpenRouter key comes from; null without one. Never the key itself."
  openRouterKey: AiKeyOrigin
}

"Where AI decisions go."
enum AiSource {
  "Broccoli's own AI, free for setup and a trial; needs no key."
  BROCCOLI_AI
  "OpenRouter with the instance's own key."
  OPENROUTER
  "The owner's own coding agent answers instead of a model; chosen with `chooseExternalAgent`, never `saveAiSource`."
  EXTERNAL_AGENT
}

"Where the instance's OpenRouter key comes from."
enum AiKeyOrigin {
  "`OPENROUTER_API_KEY` in the environment."
  ENVIRONMENT
  "Pasted by the owner during setup; it wins over the environment's."
  SAVED
}

input AiSourceInput {
  source: AiSource!
  "Replaces the saved key; needed for `OPENROUTER` when the instance has no key yet."
  openRouterKey: String
}

type SetupMutations {
  "Checks that the source works, then reads files with it from now on. Self-hosted only; owner or setup holder. A refused key is `openRouterKey` / `rejected`; a used free period is `source` / `free_period_used`."
  saveAiSource(input: AiSourceInput!): SetupSaveAiSourcePayload!
  "Completes setup from the ready step and adds the people the owner approved; refused with a ConflictError at any other step, such as after another tab went back to the review. Owner only."
  complete: SetupCompletePayload!
}

"Setup after a change."
type SetupMutationPayload {
  setup: Setup
}

"Setup after completing it."
type SetupCompletePayload {
  setup: Setup
  error: SetupCompleteError
}

union SetupCompleteError = ConflictError

"Setup after choosing how files are read."
type SetupSaveAiSourcePayload {
  setup: Setup
  error: SetupSaveAiSourceError
}

union SetupSaveAiSourceError = InvalidInputError | UnavailableError | ConflictError

type Mutation {
  setup: SetupMutations!
}
