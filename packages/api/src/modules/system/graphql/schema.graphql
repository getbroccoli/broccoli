type Query {
  "Answers `pong`; checks that the GraphQL API is reachable."
  ping: String!
  "Where the instance is in its first-run flow; readable without signing in, so the web app can route."
  onboarding: Onboarding!
}

"Where a new instance is in its first-run flow."
enum OnboardingStep {
  "No owner yet: a self-hosted instance shows setup."
  OWNER
  "The owner exists and has not named the company yet."
  COMPANY
  "Onboarding is finished."
  DONE
}

type Onboarding {
  "Always `instance`: one instance, so the client caches one object."
  id: ID!
  step: OnboardingStep!
}
