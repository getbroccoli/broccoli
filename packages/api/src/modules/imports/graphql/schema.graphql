"Every source and its records, awaiting review and approval. One per instance."
type Import {
  "Always `import`: one import per instance."
  id: ID!
  "Oldest first."
  sources: [ImportSource!]!
  "The employee records of every source; records without an email or a start date sort last by it. Owner only."
  employees(
    "Page size, 1 to 10000."
    first: Int = 100
    after: String
    orderBy: EmployeeOrder = { field: NAME, direction: ASC }
    filter: EmployeeFilter
  ): ImportEmployeeConnection!
  "How many employee records Approve would add: those complete enough to be an employee."
  readyEmployeeCount: Int!
  "Whether files can be added; the model that reads them needs a key."
  canReadFiles: Boolean!
}

"Where people came from."
enum ImportSourceKind {
  SLACK
  FILE
}

"Whether a source's records are ready. A Slack source always is."
enum ImportSourceStatus {
  "The file's columns are being worked out; it has no records yet."
  MAPPING
  MAPPED
  FAILED
}

"Why a file could not be read."
enum ImportSourceFailure {
  "No column holds a name or an email."
  NO_PEOPLE_COLUMNS
  "The model could not be reached or refused."
  UNAVAILABLE
}

"One place people came from, such as the Slack workspace; it owns its records."
type ImportSource {
  id: ID!
  kind: ImportSourceKind!
  "The Slack workspace's name, or the file's."
  name: String!
  "When the source was last read."
  readAt: DateTime!
  status: ImportSourceStatus!
  "Set when FAILED."
  failure: ImportSourceFailure
  employeeCount: Int!
  "This source's employee records."
  employees(
    "Page size, 1 to 10000."
    first: Int = 100
    after: String
    orderBy: EmployeeOrder = { field: NAME, direction: ASC }
    filter: EmployeeFilter
  ): ImportEmployeeConnection!
}

"An employee as one source proposes it; not yet an employee. Any field may be missing."
type ImportEmployee {
  id: ID!
  source: ImportSource!
  firstName: String
  lastName: String
  "Lowercased."
  email: String
  jobTitle: String
  startDate: Date
  "Null when Approve would add this record; otherwise what it lacks."
  incompleteReason: ImportEmployeeIncompleteReason
}

"Why Approve would leave an employee record out."
enum ImportEmployeeIncompleteReason {
  FIRST_NAME
  LAST_NAME
  "No email, or not a valid one."
  EMAIL
  "Another detail breaks the employee rules, such as a job title over 100 characters."
  OTHER
}

type ImportEmployeeEdge {
  cursor: String!
  node: ImportEmployee!
}

type ImportEmployeeConnection {
  edges: [ImportEmployeeEdge!]!
  pageInfo: PageInfo!
}

type Query {
  "The import. Owner only."
  import: Import!
}

type ImportMutations {
  "Reads the connected Slack workspace into the import, the first time and on every refresh; its source then holds the current members."
  readSlack: Import!
  "Leaves the import step of setup for now; the records stay."
  skip: Import!
  "Turns the import's employee records into employees and completes setup. Records that are not complete stay in the import. Approving again does nothing. Refused with CONFLICT while a file is being mapped."
  approve: Import!
  "Maps a failed file again; any other source is left as it is."
  retryFile(sourceId: ID!): Import!
  "Removes a file, its records and the stored file."
  removeFile(sourceId: ID!): Import!
}

type Mutation {
  import: ImportMutations!
}
