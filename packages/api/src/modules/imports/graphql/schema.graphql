"Every source and its records, awaiting review and approval. One per instance."
type Import {
  "Always `import`: one import per instance."
  id: ID!
  "Oldest first."
  sources: [ImportSource!]!
  "The employees the import will create: records sharing an email make one. Records without an email or a start date sort last by it. Owner only."
  employees(
    "Page size, 1 to 10000."
    first: Int = 100
    after: String
    orderBy: EmployeeOrder = { field: NAME, direction: ASC }
    filter: ImportEmployeeFilter
  ): ImportEmployeeConnection!
  "How many import employees there are, left out or not."
  employeeCount: Int!
  "How many employees Approve would add: the import employees that are ready and not left out."
  readyEmployeeCount: Int!
  "What the owner may want to settle, by kind. Nothing here blocks Approve."
  checks: [ImportCheck!]!
}

"Where people came from."
enum ImportSourceKind {
  SLACK
  FILE
}

"Whether a source's records are ready. A Slack source always is."
enum ImportSourceStatus {
  "The file's columns are being worked out; it has no records yet."
  MAPPING
  MAPPED
  FAILED
}

"Why a file could not be read."
enum ImportSourceFailure {
  "No column holds a name or an email."
  NO_PEOPLE_COLUMNS
  "The model could not be reached or refused."
  UNAVAILABLE
  "A free trial was already issued for this network, but this installation cannot access it."
  AI_FREE_PERIOD_USED
  "The free Broccoli AI period is over; an own OpenRouter key reads the file."
  AI_FREE_PERIOD_OVER
  "The free Broccoli AI allowance is used up; an own OpenRouter key reads the file."
  AI_LIMIT_REACHED
}

"One place people came from, such as the Slack workspace; it owns its records."
type ImportSource {
  id: ID!
  kind: ImportSourceKind!
  "The Slack workspace's name, or the file's."
  name: String!
  "When the source was last read."
  readAt: DateTime!
  status: ImportSourceStatus!
  "Set when FAILED."
  failure: ImportSourceFailure
  "The AI provider's own words, when it refused the file for good."
  failureMessage: String
  employeeCount: Int!
  "This source's rows, in the order it delivered them."
  records("Page size, 1 to 10000." first: Int = 100, after: String): ImportEmployeeRecordConnection!
}

"Which import employees to list."
input ImportEmployeeFilter {
  "Part of a shown first name, last name or email, any case."
  search: String
  "Only the import employees of this check."
  check: ID
}

"A field of an import employee the owner can choose."
enum ImportEmployeeField {
  FIRST_NAME
  LAST_NAME
  EMAIL
  JOB_TITLE
  START_DATE
}

"How a shown value was chosen."
enum ImportValueChoice {
  "The first source's value: files oldest first, then Slack."
  DEFAULT
  PICKED
  TYPED
}

"An employee the import will create, from the records that share an email, or one record without an email."
type ImportEmployee {
  "The shared email, or the record's id for a record without one."
  id: ID!
  "Its records, files first."
  records: [ImportEmployeeRecord!]!
  firstName: ImportEmployeeValue!
  lastName: ImportEmployeeValue!
  email: ImportEmployeeValue!
  jobTitle: ImportEmployeeValue!
  "Its value and options are YYYY-MM-DD."
  startDate: ImportEmployeeValue!
  "Path of the person's Slack photo, such as `/api/imports/photos/<id>`; null without one."
  avatarUrl: String
  leftOut: Boolean!
  "Null when Approve would add this employee, if not left out; otherwise what it lacks."
  incompleteReason: ImportEmployeeIncompleteReason
}

"One field of an import employee: what review shows and Approve uses."
type ImportEmployeeValue {
  value: String
  choice: ImportValueChoice!
  "Whether the records disagree and the owner has not chosen."
  conflict: Boolean!
  "The record whose value the owner picked; null unless PICKED."
  pickedRecord: ImportEmployeeRecord
  "The records' distinct values, in source order."
  options: [ImportValueOption!]!
}

type ImportValueOption {
  value: String!
  "The records holding it."
  records: [ImportEmployeeRecord!]!
}

"One source's row: an employee as that source proposes it, not yet an employee. Any field may be missing."
type ImportEmployeeRecord {
  id: ID!
  source: ImportSource!
  firstName: String
  lastName: String
  "Lowercased."
  email: String
  jobTitle: String
  startDate: Date
}

"Why Approve would leave an import employee out."
enum ImportEmployeeIncompleteReason {
  FIRST_NAME
  LAST_NAME
  "No email, or not a valid one."
  EMAIL
  "Another detail breaks the employee rules, such as a job title over 100 characters."
  OTHER
}

enum ImportCheckKind {
  "Records of one import employee disagree on a field."
  CONFLICT
  "Import employees that Approve would leave out for one reason."
  INCOMPLETE
}

"One kind of thing to settle in review, with how many import employees it concerns."
type ImportCheck {
  "Stable: filter employees by it."
  id: ID!
  kind: ImportCheckKind!
  count: Int!
  "Set for CONFLICT."
  field: ImportEmployeeField
  "Set for INCOMPLETE."
  reason: ImportEmployeeIncompleteReason
  "For CONFLICT: the sources with a value in these conflicts, files first."
  sources: [ImportSource!]!
}

type ImportEmployeeEdge {
  cursor: String!
  node: ImportEmployee!
}

type ImportEmployeeConnection {
  edges: [ImportEmployeeEdge!]!
  pageInfo: PageInfo!
}

type ImportEmployeeRecordEdge {
  cursor: String!
  node: ImportEmployeeRecord!
}

type ImportEmployeeRecordConnection {
  edges: [ImportEmployeeRecordEdge!]!
  pageInfo: PageInfo!
}

type Query {
  "The import. Owner only."
  import: Import!
}

type ImportMutations {
  "Reads the connected Slack workspace into the import, the first time and on every refresh; its source then holds the current members."
  readSlack: ImportReadSlackPayload!
  "Leaves the import step of setup with the demo company instead of the import, which fills only an instance without employees; the import is deleted."
  startDemo: ImportMutationPayload!
  "Turns the import employees that are not left out into employees, with the values and photos review shows, and completes the import step; the import is deleted once setup completes. Incomplete ones are not added. Approving again does nothing. Refused with a ConflictError while a file is being mapped."
  approve: ImportApprovePayload!
  "Maps a failed file again; any other source is left as it is."
  retryFile(sourceId: ID!): ImportRetryFilePayload!
  "Removes a file, its records and the stored file."
  removeFile(sourceId: ID!): ImportMutationPayload!
  "Shows a record's value or a typed one for one field of an import employee; with neither, the first source's value again. A typed value must pass the employee rules for that field; a typed email another import employee shows is refused as taken."
  chooseEmployeeValue(input: ImportChooseEmployeeValueInput!): ImportChooseEmployeeValuePayload!
  "Picks this source's value for every open conflict on this field that it holds a value in."
  chooseSourceForAll(field: ImportEmployeeField!, sourceId: ID!): ImportMutationPayload!
  "Leaves an import employee out of Approve, or adds it back."
  setEmployeeLeftOut(employeeId: ID!, leftOut: Boolean!): ImportSetEmployeeLeftOutPayload!
  "Leaves out every incomplete import employee with this reason."
  leaveOutIncomplete(reason: ImportEmployeeIncompleteReason!): ImportMutationPayload!
}

input ImportChooseEmployeeValueInput {
  employeeId: ID!
  field: ImportEmployeeField!
  "Show this record's value. Not with `value`."
  recordId: ID
  "Show this typed value."
  value: String
}

"The import after a mutation that cannot fail in an expected way."
type ImportMutationPayload {
  import: Import
}

"The import after reading Slack, or why Slack could not be read."
type ImportReadSlackPayload {
  import: Import
  error: ImportReadSlackError
}

union ImportReadSlackError = UnavailableError

"The import after `approve`, or why it was refused."
type ImportApprovePayload {
  import: Import
  error: ImportApproveError
}

union ImportApproveError = ConflictError

"The import after `retryFile`, or why it was refused."
type ImportRetryFilePayload {
  import: Import
  error: ImportRetryFileError
}

union ImportRetryFileError = ConflictError

"The import after `chooseEmployeeValue`, or why the choice was refused."
type ImportChooseEmployeeValuePayload {
  import: Import
  error: ImportChooseEmployeeValueError
}

union ImportChooseEmployeeValueError = InvalidInputError

"The import after `setEmployeeLeftOut`, or why it was refused."
type ImportSetEmployeeLeftOutPayload {
  import: Import
  error: ImportSetEmployeeLeftOutError
}

union ImportSetEmployeeLeftOutError = InvalidInputError

type Mutation {
  import: ImportMutations!
}
