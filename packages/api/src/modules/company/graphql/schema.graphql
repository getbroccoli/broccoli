"The company this instance belongs to."
type Company {
  "Always `company`: one company per instance."
  id: ID!
  "Null until the owner saves it."
  name: String
  "Pre-fill for the name field: the brand found for the owner's email domain, else a name made from the domain."
  suggestedName: String
  "Path of the company logo, such as `/api/company/logo/<id>`; null without one."
  logoUrl: String
}

type Query {
  "The company; owner only."
  company: Company!
}

"The company's details the owner edits."
input CompanyInput {
  "1 to 100 characters after trimming."
  name: String!
}

type CompanyMutations {
  "Saves the company's details; completes the company step of setup."
  update(input: CompanyInput!): CompanyUpdatePayload!
  removeLogo: CompanyPayload!
}

"The company after a mutation that cannot fail in an expected way."
type CompanyPayload {
  company: Company
}

"The company after `update`, or why it was refused."
type CompanyUpdatePayload {
  company: Company
  error: CompanyUpdateError
}

union CompanyUpdateError = InvalidInputError

type Mutation {
  company: CompanyMutations!
}
