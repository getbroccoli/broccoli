"What created a task; every task is finished with Mark done, with a result when it has a form. Features that create tasks add their own."
enum TaskType {
  "Asked by a person, who may delete it while it is open."
  MANUAL_TO_DO
}

enum TaskStatus {
  "Its assignee can do it now."
  TO_DO
  DONE
  "Stopped by the feature that created it, such as a process; the task keeps its reason."
  CANCELLED
}

"Work asked of one person. Only its assignee and the person who asked see it and its history."
type Task implements AnyRecord {
  id: ID!
  type: TaskType!
  status: TaskStatus!
  title: String!
  description: String
  dueDate: Date
  doneAt: DateTime
  cancelledAt: DateTime
  "Why the feature that created it cancelled it."
  cancelReason: String
  "What its assignee gives when they mark it done; null for a task finished with Mark done alone."
  resultForm: TaskResultForm
  "What its assignee gave, once done."
  result: TaskResult
  createdAt: DateTime!
  "Changes to this task, newest first."
  history("Page size, 1 to 10000." first: Int = 50, after: String): RecordChangeConnection!
  "Always read-only: a task changes through its own actions."
  access: RecordAccess!
}

"What a task asks its assignee to give when they mark it done."
type TaskResultForm {
  kind: TaskResultKind!
  display: TaskResultDisplay!
  options: [TaskResultOption!]!
}

enum TaskResultKind {
  "One of the form's options, with a comment when the option requires one."
  CHOICE
}

enum TaskResultDisplay {
  "One button per option, at most three, in place of Mark done."
  BUTTONS
  "A list of options to choose from, then Send."
  CHOICES
}

"One answer a form offers; features match its code, never its label."
type TaskResultOption {
  code: String!
  label: String!
  commentRequired: Boolean!
}

"What a task's assignee gave when they marked it done."
type TaskResult {
  code: String!
  "The chosen option's label."
  label: String!
  comment: String
}

# Adds the task to the shared list of record types that keep history; the server merges them.
enum RecordType {
  TASK
}

"The signed-in person's tasks, by where the ball is."
type MyTasks {
  "Tasks they hold to do, by due date."
  needsYou: [Task!]!
  "Open tasks they asked someone else for."
  waitingOnOthers: [Task!]!
  "Tasks they hold or asked for, done or cancelled in the last 14 days, newest first."
  resolvedRecently: [Task!]!
}

type Query {
  myTasks: MyTasks!
  "A task the caller holds or asked for; null for any other."
  task(id: ID!): Task
}

input TaskMarkDoneInput {
  id: ID!
  "Required by a task with a result form, refused by one without."
  result: TaskResultInput
}

input TaskResultInput {
  "One of the codes the task's form lists."
  code: String!
  "Required when the chosen option asks for one; at most 2000 characters."
  comment: String
}

input TaskDeleteInput {
  id: ID!
}

"The task after a change, or why it was refused."
type TaskPayload {
  task: Task
  "The line the change added to the task's history."
  historyLine: RecordChange
  error: TaskError
}

"The deleted task's id, or why it was refused."
type TaskDeletePayload {
  deletedTaskId: ID
  error: TaskError
}

union TaskError = InvalidInputError | NotFoundError | ConflictError

type TasksMutations {
  "The assignee finishes a task to do, whatever created it, with a result when it has a form."
  markDone(input: TaskMarkDoneInput!): TaskPayload!
  "The person who asked deletes an open task, with its place in everyone's tasks."
  delete(input: TaskDeleteInput!): TaskDeletePayload!
}

type Mutation {
  tasks: TasksMutations!
}
