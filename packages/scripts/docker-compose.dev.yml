# Development stack, layered on docker-compose.yml by `pnpm dev` (packages/scripts/dev.sh),
# which installs node_modules on the host first. Relative paths resolve from the repository root.

x-dev-service: &dev-service
  image: node:24.21.0-bookworm
  # The host user, so files written to the checkout (routeTree.gen.ts) stay theirs.
  user: ${HOST_UID:?Start the development stack with pnpm dev}:${HOST_GID:?Start the development stack with pnpm dev}
  init: true
  volumes:
    - .:/repo

services:
  # The production image does not run in development.
  broccoli:
    profiles: [self-host]

  ready:
    profiles: [self-host]

  postgres:
    volumes:
      - dev-postgres-data:/var/lib/postgresql

  api:
    <<: *dev-service
    # Node with uv, from the API's Dockerfile: the PDF word reader needs its own Python.
    image: broccoli-dev-api
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: dev
    working_dir: /repo/packages/api
    # The reader's Python environment is installed for this container, over the host's.
    # Modules read their SDL at startup, so a changed .graphql file restarts the API too.
    command:
      - sh
      - -c
      - uv sync --frozen --no-dev --quiet --project ../pdf-words &&
        exec node_modules/.bin/tsx watch --include "src/**/*.graphql" src/main.ts
    tmpfs:
      - /repo/packages/pdf-words/.venv:mode=1777,exec
    environment:
      # In the checkout's data folder, which the host user owns, so it survives restarts.
      UV_CACHE_DIR: /repo/.data/uv/cache
      UV_PYTHON_INSTALL_DIR: /repo/.data/uv/python
      UV_PYTHON_PREFERENCE: only-managed
      # The cache and the environment sit on different file systems.
      UV_LINK_MODE: copy
      DATABASE_URL: postgres://broccoli@postgres:5432/broccoli
      LOG_LEVEL: ${LOG_LEVEL:-}
      BROCCOLI_MODE: ${BROCCOLI_MODE:-}
      # In the checkout, so the host user owns it.
      DATA_DIR: /repo/.data
      SELF_HOSTED_PUBLIC_URL: ""
      BRAND_LOOKUP_URL: ${BRAND_LOOKUP_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SELF_HOSTED_BROCCOLI_AI_URL: ${SELF_HOSTED_BROCCOLI_AI_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *dev-service
    working_dir: /repo/packages/web
    command: [node_modules/.bin/vite]
    environment:
      API_PROXY_TARGET: http://api:3000
      # Host edits do not always produce file events through Docker's bind mount.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      # An empty HOST_WEB_PORT picks a free port, so worktrees never collide. Localhost only:
      # the dev server has no authentication.
      - 127.0.0.1:${HOST_WEB_PORT:-0}:5173
    # Ready once the API answers through the Vite proxy.
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:5173/readyz]
      interval: 2s
      timeout: 3s
      start_period: 60s

volumes:
  # Development data stays apart from the production image's postgres-data.
  dev-postgres-data:
    labels:
      # `pnpm dev:prune` removes this project once the checkout folder is gone.
      org.getbroccoli.checkout: ${BROCCOLI_CHECKOUT:?Start the development stack with pnpm dev}
