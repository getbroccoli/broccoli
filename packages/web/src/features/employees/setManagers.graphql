mutation SetManagers($input: EmployeeSetManagersInput!) {
  employee {
    setManagers(input: $input) {
      employees {
        id
        managerId
        manager {
          ...EmployeeName @unmask
        }
      }
      historyLines {
        ...RecordHistory_line @unmask
        record {
          ... on Employee {
            id
          }
        }
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}
