query AllowanceHistory($employeeId: ID!) {
  employee(id: $employeeId) {
    id
    timeOffTypes {
      id
      allowanceId
      # The card's figures come with the history, so a refreshed history never leaves them stale.
      entitlement
      bankHolidays
      used
      remaining
      history {
        recordedAt
        cause
        causeDate
        firstBookedDay
        lastBookedDay
        amount
        balanceAfter
        parts {
          kind
          amount
        }
        author {
          kind
          userId
          email
        }
        comment
        adjustmentId
        reversed
      }
    }
  }
}

mutation AdjustAllowance($input: AllowanceAdjustInput!) {
  timeOff {
    adjustAllowance(input: $input) {
      employeeTimeOffType {
        id
        allowanceId
        entitlement
        bankHolidays
        used
        remaining
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}

mutation ReverseAllowanceAdjustment($input: AllowanceAdjustmentReverseInput!) {
  timeOff {
    reverseAllowanceAdjustment(input: $input) {
      employeeTimeOffType {
        id
        allowanceId
        entitlement
        bankHolidays
        used
        remaining
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}
