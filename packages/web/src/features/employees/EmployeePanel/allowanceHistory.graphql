query AllowanceHistory($employeeId: ID!) {
  employee(id: $employeeId) {
    id
    timeOffTypes {
      id
      allowanceId
      history {
        recordedAt
        cause
        causeDate
        firstBookedDay
        lastBookedDay
        amount
        balanceAfter
        parts {
          kind
          amount
        }
        author {
          kind
          userId
          email
        }
        comment
      }
    }
  }
}

mutation AdjustAllowance($input: AllowanceAdjustInput!) {
  timeOff {
    adjustAllowance(input: $input) {
      employeeTimeOffType {
        id
        allowanceId
        entitlement
        bankHolidays
        used
        remaining
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}
