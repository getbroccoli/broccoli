query EmployeePanel($id: ID!) {
  employee(id: $id) {
    ...EmployeePanel_employee @unmask
  }
}

mutation UpdateEmployee($input: EmployeeUpdateInput!) {
  employee {
    update(input: $input) {
      employee {
        ...EmployeePanel_employee @unmask
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}

mutation DeleteEmployee($input: EmployeeDeleteInput!) {
  employee {
    delete(input: $input) {
      deletedEmployeeId
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

fragment EmployeePanel_employee on Employee {
  id
  firstName
  lastName
  email
  jobTitle
  startDate
  avatarUrl
}
