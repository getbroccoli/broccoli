query EmployeePanel($id: ID!) {
  employee(id: $id) {
    ...EmployeePanel_employee @unmask
  }
}

mutation UpdateEmployee($input: EmployeeUpdateInput!) {
  employees {
    update(input: $input) {
      employee {
        ...EmployeePanel_employee @unmask
      }
      historyLine {
        ...RecordHistory_line @unmask
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}

mutation SetPermissionProfiles($input: EmployeeSetPermissionProfilesInput!) {
  employees {
    setPermissionProfiles(input: $input) {
      employee {
        ...EmployeePanel_employee @unmask
      }
      historyLine {
        ...RecordHistory_line @unmask
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}

mutation DeleteEmployee($input: EmployeeDeleteInput!) {
  employees {
    delete(input: $input) {
      deletedEmployeeId
      reportHistoryLines {
        ...RecordHistory_line @unmask
        # The report, now without a manager, so their panel shows it.
        record {
          id
          ... on Employee {
            managerId
            manager {
              id
            }
          }
        }
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

fragment EmployeePanel_employee on Employee {
  id
  firstName
  lastName
  email
  jobTitle
  startDate
  managerId
  manager {
    ...EmployeeName @unmask
  }
  location {
    ...LocationName @unmask
  }
  avatarUrl
  permissionProfiles
  signInStatus {
    ...SignInStatus @unmask
  }
  access {
    canDelete
    editableFields
  }
  timeOffTypes {
    timeOffType {
      id
      name
    }
    balance
    periodStart
    periodEnd
    entitlement
    bankHolidays
    remaining
    used
  }
  employmentTerms {
    periods {
      termsId
      termsName
      startDate
      endDate
    }
  }
}

# Each location's terms for new people, to say after a location is saved that the person's
# terms stay. Admins only.
query LocationStartTerms {
  locations {
    id
    name
    terms {
      id
      name
    }
  }
}
