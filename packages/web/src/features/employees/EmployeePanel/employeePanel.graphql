query EmployeePanel($id: ID!) {
  employee(id: $id) {
    ...EmployeePanel_employee @unmask
  }
}

mutation UpdateEmployee($input: EmployeeUpdateInput!) {
  employee {
    update(input: $input) {
      employee {
        ...EmployeePanel_employee @unmask
      }
      historyLine {
        ...RecordHistory_line @unmask
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}

mutation DeleteEmployee($input: EmployeeDeleteInput!) {
  employee {
    delete(input: $input) {
      deletedEmployeeId
      reportHistoryLines {
        ...RecordHistory_line @unmask
        # The report, now without a manager, so their panel shows it.
        record {
          ... on Employee {
            id
            managerId
            manager {
              id
            }
          }
        }
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

fragment EmployeePanel_employee on Employee {
  id
  firstName
  lastName
  email
  jobTitle
  startDate
  managerId
  manager {
    ...ManagerName @unmask
  }
  avatarUrl
}
