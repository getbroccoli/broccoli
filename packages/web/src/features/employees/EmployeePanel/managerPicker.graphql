query ManagerOptions($search: String) {
  employees(first: 8, filter: { search: $search }) {
    edges {
      node {
        ...ManagerName @unmask
        email
      }
    }
  }
}

# A manager's name, which the panel reads from the cache to show the manager it holds by id.
fragment ManagerName on Employee {
  id
  firstName
  lastName
}
