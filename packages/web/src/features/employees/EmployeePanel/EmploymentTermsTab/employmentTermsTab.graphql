# The tab reads the person's week and rules on its own, refreshed each time it shows, since
# Settings can plan changes to the terms behind them.
query EmploymentTermsTab($id: ID!) {
  employee(id: $id) {
    id
    employmentTerms {
      ...EmploymentTermsTab_terms @unmask
    }
  }
}

fragment EmploymentTermsTab_terms on EmployeeEmploymentTerms {
  earliestChange
  periods {
    termsId
    termsName
    startDate
    endDate
  }
  workingWeek {
    source
    startDate
    endDate
    week {
      id
      mondayMinutes
      tuesdayMinutes
      wednesdayMinutes
      thursdayMinutes
      fridayMinutes
      saturdayMinutes
      sundayMinutes
      bankHolidayCalendar
    }
  }
  timeOff {
    timeOffType {
      id
      name
      icon
      colour
      defaultRules {
        balance
        entitlementDays
        bankHolidays
      }
    }
    versions {
      source
      startDate
      endDate
      rules {
        id
        balance
        bankHolidays
        leaveYearStart {
          kind
          month
          day
        }
        yearlyEntitlement {
          days
          daysPerWeek
        }
      }
    }
  }
}

query TermsChangePreview($input: EmployeeTermsChangeInput!) {
  termsChangePreview(input: $input) {
    moves {
      startDate
      employmentTerms {
        ...EmploymentTermsTab_terms @unmask
      }
      currentTerms {
        ...EmploymentTermsTab_terms @unmask
      }
    }
    skipped {
      reason
    }
  }
}

mutation ChangeTerms($input: EmployeeTermsChangeInput!) {
  employees {
    changeTerms(input: $input) {
      moved {
        startDate
        # The person's new terms, for the tab and the Details row.
        employee {
          ...EmployeePanel_employee @unmask
          employmentTerms {
            ...EmploymentTermsTab_terms @unmask
          }
        }
      }
      skipped {
        reason
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}

mutation CancelTermsChange($input: EmployeeTermsCancelChangeInput!) {
  employees {
    cancelTermsChange(input: $input) {
      employee {
        ...EmployeePanel_employee @unmask
        employmentTerms {
          ...EmploymentTermsTab_terms @unmask
        }
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

mutation SetOwnWorkingWeek($input: EmployeeOwnWorkingWeekSetInput!) {
  employees {
    setOwnWorkingWeek(input: $input) {
      ...OwnWorkingWeekPayload @unmask
    }
  }
}

mutation UseTermsWorkingWeek($input: EmployeeTermsWorkingWeekUseInput!) {
  employees {
    useTermsWorkingWeek(input: $input) {
      ...OwnWorkingWeekPayload @unmask
    }
  }
}

mutation CancelOwnWorkingWeekChange($input: EmployeeOwnWorkingWeekCancelChangeInput!) {
  employees {
    cancelOwnWorkingWeekChange(input: $input) {
      ...OwnWorkingWeekPayload @unmask
    }
  }
}

# The person's new week, for the tab and the panel.
fragment OwnWorkingWeekPayload on EmployeeOwnWorkingWeekPayload {
  employee {
    ...EmployeePanel_employee @unmask
    employmentTerms {
      ...EmploymentTermsTab_terms @unmask
    }
  }
  error {
    __typename
    ... on Error {
      message
    }
    ... on InvalidInputError {
      fields {
        field
        code
      }
    }
  }
}

# Whether the terms offer a type on a date, for what a return to their rules does.
query TermsTypeOffer($termsId: ID!, $timeOffTypeId: ID!) {
  terms(id: $termsId) {
    id
    timeOff(timeOffTypeId: $timeOffTypeId) {
      versions {
        id
        startDate
        endDate
      }
    }
  }
}

mutation SetOwnRules($input: TimeOffOwnRulesSetInput!) {
  timeOff {
    setOwnRules(input: $input) {
      ...OwnRulesPayload @unmask
    }
  }
}

mutation UseTermsRules($input: TimeOffTermsRulesUseInput!) {
  timeOff {
    useTermsRules(input: $input) {
      ...OwnRulesPayload @unmask
    }
  }
}

mutation CancelOwnRulesChange($input: TimeOffOwnRulesCancelChangeInput!) {
  timeOff {
    cancelOwnRulesChange(input: $input) {
      ...OwnRulesPayload @unmask
    }
  }
}

# The person's new rules, for the tab and the panel.
fragment OwnRulesPayload on TimeOffOwnRulesPayload {
  employee {
    ...EmployeePanel_employee @unmask
    employmentTerms {
      ...EmploymentTermsTab_terms @unmask
    }
  }
  error {
    __typename
    ... on Error {
      message
    }
    ... on InvalidInputError {
      fields {
        field
        code
      }
    }
  }
}
