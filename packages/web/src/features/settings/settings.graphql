query EmailSettings {
  setup {
    id
    mail {
      id
      source
      from
      hasSecret
    }
  }
}

mutation SaveMailSettings($input: MailSettingsInput!) {
  setup {
    saveMailSettings(input: $input) {
      setup {
        id
        passwordResetByEmail
        mail {
          id
          source
          from
          hasSecret
        }
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}

mutation SendTestEmail {
  setup {
    sendTestEmail {
      setup {
        id
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}
