query LocationSettings {
  locations {
    id
    name
    peopleCount
  }
}

mutation CreateLocation($input: LocationCreateInput!) {
  employees {
    createLocation(input: $input) {
      location {
        id
        name
        peopleCount
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}

mutation UpdateLocation($input: LocationUpdateInput!) {
  employees {
    updateLocation(input: $input) {
      location {
        id
        name
        peopleCount
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}

mutation DeleteLocation($input: LocationDeleteInput!) {
  employees {
    deleteLocation(input: $input) {
      deletedLocationId
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}
