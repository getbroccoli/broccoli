query TimeOffTypePanel($id: ID!) {
  timeOffSettings {
    timeOffType(id: $id) {
      ...TimeOffTypePanel_type @unmask
    }
  }
}

# A time off type as its panel edits it.
fragment TimeOffTypePanel_type on TimeOffTypeSummary {
  timeOffType {
    id
    name
    icon
    colour
    reasonVisibleToColleagues
  }
  policies {
    ...TimeOffPolicySummary @unmask
  }
  canDelete
  reasonAlwaysPrivate
}

mutation UpdateTimeOffType($input: TimeOffTypeUpdateInput!) {
  timeOffType {
    update(input: $input) {
      timeOffType {
        ...TimeOffTypePanel_type @unmask
      }
      allowancesUpdated
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}

mutation DeleteTimeOffType($input: TimeOffTypeDeleteInput!) {
  timeOffType {
    delete(input: $input) {
      deletedTimeOffTypeId
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}
