query EmploymentTerms {
  allTerms {
    id
    name
    isDefault
    peopleCount
    hasUnpublishedChanges
    workingWeek {
      id
      startDate
      endDate
      mondayMinutes
      tuesdayMinutes
      wednesdayMinutes
      thursdayMinutes
      fridayMinutes
      saturdayMinutes
      sundayMinutes
      bankHolidayCalendar
    }
    timeOff {
      timeOffType {
        id
        typeKey
      }
      versions {
        id
        startDate
        endDate
        balance
        bankHolidays
        leaveYearStart {
          kind
          month
          day
        }
        yearlyEntitlement {
          days
          daysPerWeek
        }
      }
    }
  }
}

query EmploymentTermsStack($id: ID!) {
  terms(id: $id) {
    id
    name
    isDefault
    peopleCount
    deleteBlocker
    hadPeople
    hasUnpublishedChanges
    earliestChange
    locations {
      id
      name
    }
    unpublishedWorkingWeek {
      id
      revision
      mondayMinutes
      tuesdayMinutes
      wednesdayMinutes
      thursdayMinutes
      fridayMinutes
      saturdayMinutes
      sundayMinutes
      bankHolidayCalendar
    }
    workingWeek {
      id
      startDate
      endDate
      mondayMinutes
      tuesdayMinutes
      wednesdayMinutes
      thursdayMinutes
      fridayMinutes
      saturdayMinutes
      sundayMinutes
      bankHolidayCalendar
    }
    timeOff {
      timeOffType {
        id
        name
        icon
        colour
        private
        defaultRules {
          balance
          entitlementDays
          bankHolidays
        }
      }
      unpublished {
        id
        revision
        balance
        bankHolidays
        leaveYearStart {
          kind
          month
          day
        }
        yearlyEntitlement {
          days
          daysPerWeek
        }
      }
      versions {
        id
        startDate
        endDate
        balance
        bankHolidays
        leaveYearStart {
          kind
          month
          day
        }
        yearlyEntitlement {
          days
          daysPerWeek
        }
      }
    }
  }
}

query TermsPublishSuggestions($id: ID!, $from: Date!) {
  terms(id: $id) {
    id
    publishSuggestions(from: $from) {
      owners {
        termsId
        employeeId
        name
        reached {
          id
          firstName
          lastName
        }
      }
    }
  }
}

fragment TermsChangeError on Error {
  __typename
  message
  ... on InvalidInputError {
    fields {
      field
      code
    }
  }
}

mutation SaveTermsWorkingWeek($input: WorkingPatternSaveInput!) {
  employees {
    saveWorkingPattern(input: $input) {
      workingWeek {
        id
      }
      error {
        ...TermsChangeError
      }
    }
  }
}

mutation DiscardTermsWorkingWeek($input: WorkingPatternDiscardInput!) {
  employees {
    discardWorkingPattern(input: $input) {
      discardedVersionId
      error {
        ...TermsChangeError
      }
    }
  }
}

mutation CancelTermsWorkingWeekChange($input: WorkingPatternCancelChangeInput!) {
  employees {
    cancelWorkingPatternChange(input: $input) {
      cancelledAssignmentId
      error {
