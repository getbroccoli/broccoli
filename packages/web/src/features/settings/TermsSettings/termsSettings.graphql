query EmploymentTerms {
  allTerms {
    id
    name
    isDefault
    peopleCount
    locations {
      id
      name
    }
    workingWeek {
      id
      startDate
      endDate
      mondayMinutes
      tuesdayMinutes
      wednesdayMinutes
      thursdayMinutes
      fridayMinutes
      saturdayMinutes
      sundayMinutes
      fullDayMinutes
      bankHolidayCalendar
    }
    timeOff {
      timeOffType {
        id
        typeKey
      }
      versions {
        id
        startDate
        endDate
        balance
        bankHolidays
        leaveYearStart {
          kind
          month
          day
        }
        yearlyEntitlement {
          days
          daysPerWeek
        }
      }
    }
  }
}

query EmploymentTermsStack($id: ID!) {
  terms(id: $id) {
    id
    name
    isDefault
    peopleCount
    locations {
      id
      name
    }
    workingPattern {
      id
      earliestChange
    }
    workingWeek {
      id
      startDate
      endDate
      mondayMinutes
      tuesdayMinutes
      wednesdayMinutes
      thursdayMinutes
      fridayMinutes
      saturdayMinutes
      sundayMinutes
      fullDayMinutes
      bankHolidayCalendar
    }
    timeOff {
      timeOffType {
        id
        name
        icon
        colour
      }
      policy {
        id
        earliestChange
      }
      earliestOffer
      versions {
        id
        startDate
        endDate
        balance
        bankHolidays
        leaveYearStart {
          kind
          month
          day
        }
        yearlyEntitlement {
          days
          daysPerWeek
        }
      }
    }
  }
}

query TermsWeekReach($id: ID!, $from: Date!) {
  terms(id: $id) {
    id
    workingPattern {
      id
      reach(from: $from) {
        id
        firstName
        lastName
      }
    }
  }
}

query TermsTimeOffReach($id: ID!, $timeOffTypeId: ID!, $from: Date!, $offer: Boolean!) {
  terms(id: $id) {
    id
    timeOff(timeOffTypeId: $timeOffTypeId) {
      timeOffType {
        id
      }
      policy @skip(if: $offer) {
        id
        reach(from: $from) {
          id
          firstName
          lastName
        }
      }
      offerReach(from: $from) @include(if: $offer) {
        id
        firstName
        lastName
      }
    }
  }
}

fragment TermsChangeError on Error {
  __typename
  message
  ... on InvalidInputError {
    fields {
      field
      code
    }
  }
}

mutation ChangeTermsWorkingWeek($input: WorkingPatternChangeInput!) {
  employees {
    changeWorkingPattern(input: $input) {
      workingPattern {
        id
      }
      error {
        ...TermsChangeError
      }
    }
  }
}

mutation CancelTermsWorkingWeekChange($input: WorkingPatternCancelChangeInput!) {
  employees {
    cancelWorkingPatternChange(input: $input) {
      workingPattern {
        id
      }
      error {
        ...TermsChangeError
      }
    }
  }
}

mutation OfferTermsTimeOff($input: TimeOffPolicyCreateInput!) {
  timeOff {
    createPolicy(input: $input) {
      timeOffPolicy {
        id
      }
      error {
        ...TermsChangeError
      }
    }
  }
}

mutation ChangeTermsTimeOffRules($input: TimeOffPolicyChangeInput!) {
  timeOff {
    changePolicy(input: $input) {
      timeOffPolicy {
        id
      }
      error {
        ...TermsChangeError
      }
    }
  }
}

mutation CancelTermsTimeOffChange($input: TimeOffPolicyCancelChangeInput!) {
  timeOff {
    cancelPolicyChange(input: $input) {
      timeOffPolicy {
        id
      }
      error {
        ...TermsChangeError
      }
    }
  }
}
