query EmploymentTerms {
  allTerms {
    id
    name
    isDefault
    peopleCount
    locations {
      id
      name
    }
    workingWeek {
      id
      startDate
      endDate
      mondayMinutes
      tuesdayMinutes
      wednesdayMinutes
      thursdayMinutes
      fridayMinutes
      saturdayMinutes
      sundayMinutes
      fullDayMinutes
      bankHolidayCalendar
    }
    timeOff {
      timeOffType {
        id
        typeKey
      }
      versions {
        id
        startDate
        endDate
        balance
        bankHolidays
        leaveYearStart {
          kind
          month
          day
        }
        yearlyEntitlement {
          days
          daysPerWeek
        }
      }
    }
  }
}

query EmploymentTermsStack($id: ID!) {
  terms(id: $id) {
    id
    name
    isDefault
    peopleCount
    deleteBlocker
    locations {
      id
      name
    }
    workingWeek {
      id
      startDate
      endDate
      mondayMinutes
      tuesdayMinutes
      wednesdayMinutes
      thursdayMinutes
      fridayMinutes
      saturdayMinutes
      sundayMinutes
      fullDayMinutes
      bankHolidayCalendar
    }
    timeOff {
      timeOffType {
        id
        name
        icon
        colour
      }
      versions {
        id
        startDate
        endDate
        balance
        bankHolidays
        leaveYearStart {
          kind
          month
          day
        }
        yearlyEntitlement {
          days
          daysPerWeek
        }
      }
    }
  }
}

mutation CreateTerms($input: TermsCreateInput!) {
  employees {
    createTerms(input: $input) {
      terms {
        id
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}

mutation RenameTerms($input: TermsUpdateInput!) {
  employees {
    updateTerms(input: $input) {
      terms {
        id
        name
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}

mutation DeleteTerms($input: TermsDeleteInput!) {
  employees {
    deleteTerms(input: $input) {
      deletedTermsId
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}
