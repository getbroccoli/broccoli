query AiStep {
  setup {
    id
    ai {
      id
      source
      openRouterKey
    }
  }
  import {
    id
    demoAvailable
  }
}

mutation ChooseExternalAgent {
  chooseExternalAgent {
    setup {
      id
      ai {
        id
        source
        externalAgent {
          id
        }
      }
    }
    error {
      __typename
      ... on Error {
        message
      }
    }
  }
}

mutation SaveAiSource($input: AiSourceInput!) {
  saveAiSource(input: $input) {
    setup {
      id
      ai {
        id
        source
        openRouterKey
        externalAgent {
          id
        }
      }
    }
    error {
      __typename
      ... on Error {
        message
      }
      ... on InvalidInputError {
        fields {
          field
          code
        }
      }
    }
  }
}
