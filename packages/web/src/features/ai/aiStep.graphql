query AiStep {
  setup {
    id
    ai {
      id
      source
      openRouterKey
    }
  }
  import {
    id
    demoAvailable
  }
}

mutation SaveAiSource($input: AiSourceInput!) {
  setup {
    saveAiSource(input: $input) {
      setup {
        id
        ai {
          id
          source
          openRouterKey
        }
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}
