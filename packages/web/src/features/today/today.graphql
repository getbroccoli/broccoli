fragment Today_employee on Employee {
  id
  firstName
}

# Everyone the viewer may read, with who is out and who starts or has an anniversary soon.
# shortcut: like Time off, this reads every readable person's range in the browser; move it to a
# server-side summary when companies of thousands find Today slow.
query TodayPeople($from: Date!, $until: Date!) {
  employees(first: 10000) {
    edges {
      node {
        id
        firstName
        lastName
        avatarUrl
        startDate
        managerId
        whosOut(from: $from, until: $until) {
          timeOff {
            id
            status
            startDate
            endDate
            days {
              date
            }
            timeOffType {
              id
              name
            }
          }
        }
      }
    }
  }
}

# The signed-in person's allowances, coming time off and whether they book or ask for it.
query TodayMyTimeOff($id: ID!, $from: Date!, $until: Date!) {
  employee(id: $id) {
    id
    canCreateTimeOff: canCreate(recordType: TIME_OFF)
    timeOffTypes {
      id
      timeOffType {
        id
        name
      }
      balance
      entitlement
      remaining
    }
    # Booked straight away or asked for: a booking that needs no approval is no request.
    whosOut(from: $from, until: $until) {
      timeOff {
        id
        status
        startDate
        endDate
        timeOffType {
          id
          name
        }
      }
    }
  }
}
