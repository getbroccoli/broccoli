fragment Today_employee on Employee {
  id
  firstName
}

# Everyone the viewer may read, with who is out and who starts or has an anniversary soon.
query TodayPeople($from: Date!, $until: Date!) {
  employees(first: 10000) {
    edges {
      node {
        id
        firstName
        lastName
        avatarUrl
        startDate
        managerId
        whosOut(from: $from, until: $until) {
          timeOff {
            id
            status
            startDate
            endDate
            timeOffType {
              id
              name
            }
          }
        }
      }
    }
  }
}

# The signed-in person's allowances, requests and whether they book or ask for time off.
query TodayMyTimeOff($id: ID!) {
  employee(id: $id) {
    id
    canCreateTimeOff: canCreate(recordType: TIME_OFF)
    timeOffTypes {
      id
      timeOffType {
        id
        name
      }
      balance
      entitlement
      remaining
    }
    timeOffRequests {
      id
      status
      startDate
      endDate
      timeOffType {
        id
        name
      }
    }
  }
}
