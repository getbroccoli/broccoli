query YourAgent {
  me {
    id
    email
    employee {
      id
      firstName
      lastName
    }
    actingAs {
      id
    }
  }
  setup {
    id
    mode
  }
  myAgentConnection {
    id
    clientName
    connectedAt
    canChangeThings
    lastUsedAt
  }
  myLastEndedAgentConnection {
    id
    clientName
    reason
  }
}

mutation DisconnectAgent {
  mcpAgents {
    disconnect {
      endedAgentConnection {
        id
        clientName
        reason
      }
    }
  }
}

query YourAgentActivity {
  myAgentActivity(first: 50) {
    edges {
      node {
        id
        tool
        outcome
        resultCount
        calledAt
      }
    }
  }
}

# Not refetched on live nudges, which would drop the pages already loaded.
query YourAgentActivityHistory($after: String) {
  myAgentActivity(first: 30, after: $after) {
    edges {
      node {
        id
        clientName
        tool
        outcome
        resultCount
        calledAt
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
