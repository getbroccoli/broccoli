query Session {
  me {
    id
    email
    isOwner
    permissionProfiles
    operations
    employee {
      id
      firstName
      lastName
      jobTitle
      avatarUrl
    }
  }
  setup {
    id
    step
    mode
    holder
    demoExpiresAt
    ownerSignInMethod
    passwordResetByEmail
  }
}
