query Session {
  me {
    id
    email
    isOwner
    permissionProfiles
    operations
    employee {
      id
      ...ProfileMenu_employee
      ...Today_employee
    }
    actingAs {
      id
      firstName
      lastName
    }
  }
  setup {
    id
    step
    mode
    holder
    demoExpiresAt
    ownerSignInMethod
    passwordResetByEmail
  }
}
