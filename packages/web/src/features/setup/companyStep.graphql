query CompanyStep {
  company {
    id
    name
    suggestedName
    logoUrl
  }
}

mutation UpdateCompany($input: CompanyInput!) {
  updateCompany(input: $input) {
    company {
      id
      name
      logoUrl
    }
    error {
      __typename
      ... on Error {
        message
      }
    }
  }
}

mutation RemoveCompanyLogo {
  removeCompanyLogo {
    company {
      id
      logoUrl
    }
  }
}
