query CompanyStep {
  company {
    id
    name
    suggestedName
    logoUrl
  }
}

mutation UpdateCompany($input: CompanyInput!) {
  company {
    update(input: $input) {
      company {
        id
        name
        logoUrl
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

mutation RemoveCompanyLogo {
  company {
    removeLogo {
      company {
        id
        logoUrl
      }
    }
  }
}
