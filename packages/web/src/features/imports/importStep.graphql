query ImportStep {
  setup {
    id
    ai {
      id
      source
      externalAgent {
        id
        listening
        ...ExternalAgentPill_externalAgent
      }
    }
  }
  slackConnection {
    id
    workspaceName
  }
  import {
    id
    reading
    demoAvailable
    sources {
      id
      kind
      name
      status
      readBy
      pickedUpByExternalAgent
      employeeCount
      ...FileSourceCard_source
    }
  }
}

mutation ReadSlack {
  readSlackIntoImport {
    import {
      id
      reading
      demoAvailable
      sources {
        id
        kind
        employeeCount
        ...FileSourceCard_source
      }
    }
    error {
      __typename
      ... on Error {
        message
      }
    }
  }
}

mutation RetryFile($sourceId: ID!) {
  retryImportFile(sourceId: $sourceId) {
    import {
      id
      reading
      demoAvailable
      sources {
        id
        kind
        employeeCount
        ...FileSourceCard_source
      }
    }
    error {
      __typename
      ... on Error {
        message
      }
    }
  }
}

mutation RemoveSource($sourceId: ID!) {
  removeImportSource(sourceId: $sourceId) {
    import {
      id
      reading
      demoAvailable
      sources {
        id
        kind
        employeeCount
        ...FileSourceCard_source
      }
    }
  }
}

mutation AllowOriginalFileRead($sourceId: ID!, $aiSource: AiSource) {
  allowOriginalFileRead(sourceId: $sourceId, aiSource: $aiSource) {
    import {
      id
      reading
      demoAvailable
      sources {
        id
        kind
        status
        readBy
        pickedUpByExternalAgent
        employeeCount
        ...FileSourceCard_source
      }
    }
    error {
      __typename
      ... on Error {
        message
      }
    }
  }
}
