query ImportStep {
  slackConnection {
    id
    workspaceName
  }
  import {
    id
    canReadFiles
    sources {
      id
      kind
      status
      employeeCount
      ...FileSourceCard_source
    }
  }
}

mutation ReadSlack {
  import {
    readSlack {
      id
      sources {
        id
        kind
        status
        employeeCount
        ...FileSourceCard_source
      }
    }
  }
}

mutation RetryFile($sourceId: ID!) {
  import {
    retryFile(sourceId: $sourceId) {
      id
      sources {
        id
        kind
        status
        employeeCount
        ...FileSourceCard_source
      }
    }
  }
}

mutation RemoveFile($sourceId: ID!) {
  import {
    removeFile(sourceId: $sourceId) {
      id
      sources {
        id
        kind
        status
        employeeCount
        ...FileSourceCard_source
      }
    }
  }
}

mutation SkipImport {
  import {
    skip {
      id
    }
  }
}
