query ImportStep {
  slackConnection {
    id
    workspaceName
  }
  import {
    id
    sources {
      id
      kind
      status
      employeeCount
      ...FileSourceCard_source
    }
  }
}

mutation ReadSlack {
  import {
    readSlack {
      import {
        id
        sources {
          id
          kind
          status
          employeeCount
          ...FileSourceCard_source
        }
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

mutation RetryFile($sourceId: ID!) {
  import {
    retryFile(sourceId: $sourceId) {
      import {
        id
        sources {
          id
          kind
          status
          employeeCount
          ...FileSourceCard_source
        }
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

mutation RemoveFile($sourceId: ID!) {
  import {
    removeFile(sourceId: $sourceId) {
      import {
        id
        sources {
          id
          kind
          status
          employeeCount
          ...FileSourceCard_source
        }
      }
    }
  }
}

mutation StartDemo {
  import {
    startDemo {
      import {
        id
      }
    }
  }
}
