query ImportStep {
  import {
    id
    canConnectSlack
    sources {
      id
      kind
      name
      employeeCount
    }
  }
}

mutation RefreshSlack {
  import {
    refreshSlack {
      id
      sources {
        id
        kind
        name
        employeeCount
      }
    }
  }
}

mutation SkipImport {
  import {
    skip {
      id
    }
  }
}
