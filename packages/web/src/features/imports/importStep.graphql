query ImportStep {
  slackConnection {
    id
    workspaceName
  }
  import {
    id
    canReadFiles
    sources {
      id
      kind
      name
      status
      failure
      employeeCount
    }
  }
}

mutation ReadSlack {
  import {
    readSlack {
      id
      sources {
        id
        kind
        name
        status
        failure
        employeeCount
      }
    }
  }
}

mutation RetryFile($sourceId: ID!) {
  import {
    retryFile(sourceId: $sourceId) {
      id
      sources {
        id
        kind
        name
        status
        failure
        employeeCount
      }
    }
  }
}

mutation RemoveFile($sourceId: ID!) {
  import {
    removeFile(sourceId: $sourceId) {
      id
      sources {
        id
        kind
        name
        status
        failure
        employeeCount
      }
    }
  }
}

mutation SkipImport {
  import {
    skip {
      id
    }
  }
}

mutation ApproveImport {
  import {
    approve {
      id
    }
  }
}
