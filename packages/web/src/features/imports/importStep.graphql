query ImportStep {
  setup {
    id
    ai {
      id
      source
      externalAgent {
        id
        ...ExternalAgentPill_externalAgent
      }
    }
  }
  slackConnection {
    id
    workspaceName
  }
  import {
    id
    reading
    demoAvailable
    sources {
      id
      kind
      employeeCount
      ...FileSourceCard_source
    }
  }
}

mutation ReadSlack {
  import {
    readSlack {
      import {
        id
        reading
        demoAvailable
        sources {
          id
          kind
          employeeCount
          ...FileSourceCard_source
        }
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

mutation RetryFile($sourceId: ID!) {
  import {
    retryFile(sourceId: $sourceId) {
      import {
        id
        reading
        demoAvailable
        sources {
          id
          kind
          employeeCount
          ...FileSourceCard_source
        }
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

mutation RemoveFile($sourceId: ID!) {
  import {
    removeFile(sourceId: $sourceId) {
      import {
        id
        reading
        demoAvailable
        sources {
          id
          kind
          employeeCount
          ...FileSourceCard_source
        }
      }
    }
  }
}
