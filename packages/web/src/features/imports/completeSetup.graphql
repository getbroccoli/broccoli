mutation CompleteSetup($input: SetupCompleteInput) {
  system {
    completeSetup(input: $input) {
      setup {
        id
        step
      }
      invites {
        employeeId
        name
        expiresAt
        link
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}
