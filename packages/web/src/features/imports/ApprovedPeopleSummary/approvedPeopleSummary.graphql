query ApprovedPeopleSummary {
  company {
    id
    name
    logoUrl
  }
  import {
    id
    readyEmployeeCount
    readyEmployeeSources {
      id
      kind
    }
    employees(first: 100) {
      edges {
        node {
          id
          firstName {
            value
          }
          lastName {
            value
          }
          avatarUrl
          leftOut
          incompleteReason
        }
      }
    }
  }
}
