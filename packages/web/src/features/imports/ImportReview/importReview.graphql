query ImportReview(
  $first: Int
  $after: String
  $orderBy: EmployeeOrder
  $filter: ImportEmployeeFilter
) {
  import {
    id
    employeeCount
    readyEmployeeCount
    reading
    sources {
      id
      employeeCount
      ...SourceChips_source
    }
    checks {
      id
      kind
      count
      ...ThingsToCheck_check
    }
    employees(first: $first, after: $after, orderBy: $orderBy, filter: $filter) {
      edges {
        node {
          id
          ...ImportReviewColumns_importEmployee
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

mutation ApproveImport {
  import {
    approve {
      import {
        id
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}
