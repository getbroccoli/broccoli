fragment ThingsToCheck_check on ImportCheck {
  id
  kind
  count
  field
  reason
  sources {
    id
    name
  }
}

mutation ChooseSourceForAll($field: ImportEmployeeField!, $sourceId: ID!) {
  chooseImportSourceForAll(field: $field, sourceId: $sourceId) {
    import {
      id
      # Review's own changes move the version Approve sends.
      version
    }
  }
}

mutation LeaveOutIncomplete($reason: ImportEmployeeIncompleteReason!) {
  leaveOutIncompleteImportEmployees(reason: $reason) {
    import {
      id
      # Review's own changes move the version Approve sends.
      version
    }
  }
}
