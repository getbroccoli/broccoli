mutation ChooseEmployeeValue($input: ImportChooseEmployeeValueInput!) {
  import {
    chooseEmployeeValue(input: $input) {
      import {
        id
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}
