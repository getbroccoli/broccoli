query InviteDelivery {
  setup {
    id
    inviteDelivery
    mail {
      id
      from
    }
  }
}

mutation InviteEmployees($input: InviteSendInput!) {
  employees {
    invite(input: $input) {
      invites {
        employee {
          id
          signInStatus {
            ...SignInStatus @unmask
          }
        }
        expiresAt
        delivery
        link
        historyLine {
          ...RecordHistory_line @unmask
        }
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}

mutation CancelInvite($input: InviteCancelInput!) {
  employees {
    cancelInvite(input: $input) {
      employee {
        id
        signInStatus {
          ...SignInStatus @unmask
        }
      }
      historyLine {
        ...RecordHistory_line @unmask
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

fragment SignInStatus on SignInStatus {
  state
  isWorkspaceOwner
  expiresAt
  notSent
  emailHasAccount
  canBeInvited
}
