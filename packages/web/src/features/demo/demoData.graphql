query DemoData {
  demo {
    id
    isPresent
  }
}

mutation ExitDemo {
  demo {
    exit {
      demoData {
        id
        isPresent
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

mutation StartDemo {
  imports {
    startDemo {
      import {
        id
      }
    }
  }
}
